<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>練功房・老師端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Quicksand:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: teacher desk for the 練功房 — header with tabs, then one wide panel per tab (records table + student detail, accounts table, QR, rules). Same pink/lilac family as the student page, toned down for reading data. */
:root{
  --sky1:#FFF6F9; --sky2:#F4F1FF; --card:#FFFFFF; --ink:#45374F; --muted:#958AA3; --line:#F0DDE7;
  --pink:#E8689A; --pink-dk:#CF4E7F; --pink-soft:#FFE8F0; --lilac:#9C82EA; --lilac-soft:#EFEAFF;
  --mint:#33B68E; --mint-soft:#DFF6EE; --gold:#E3A112; --bad:#E85B5B; --bad-soft:#FFE8E8;
  --hand:"LXGW WenKai TC","Noto Sans TC",sans-serif; --round:"Quicksand","Noto Sans TC",sans-serif; --body:"Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(170deg,var(--sky1),var(--sky2));background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
header{background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
.hin{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--hand);font-weight:700;font-size:24px;background:linear-gradient(90deg,var(--pink),var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-family:var(--body);font-size:13px;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-left:6px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;cursor:pointer;color:var(--muted)}
nav button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.who{margin-left:auto;font-size:13px;color:var(--muted)}
.linkbtn{border:none;background:none;color:var(--pink-dk);font-weight:700;cursor:pointer;text-decoration:underline;padding:0}
main{max-width:1180px;margin:0 auto;padding:20px 18px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px}
h2{font-family:var(--hand);font-size:22px;margin:0 0 10px}
.note{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;background:var(--pink);color:#fff;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--pink-dk);border:2px solid var(--line)}
.btn.sm{padding:4px 12px;font-size:13px}
.btn.red{background:var(--bad)}
input[type=text],input[type=email],input[type=password],select,textarea{border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;min-width:0}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pink);outline:none}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:12px;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--pink-soft)}
tr.sel td{background:var(--lilac-soft)}
td input{width:100%;min-width:80px}
.num{font-family:var(--round);font-weight:700;font-variant-numeric:tabular-nums}
.bad{color:var(--bad);font-weight:700}.good{color:var(--mint);font-weight:700}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--lilac-soft);color:#7357D0}
.pill.r0{background:#FBE3D6;color:#B8653F}.pill.r1{background:#E9EBF3;color:#6B7390}.pill.r2{background:#FFF1C9;color:#A87500}.pill.r3{background:#D8F5EE;color:#1F8E7C}.pill.r4{background:#F6E3FF;color:#9A49C9}.pill.r5{background:linear-gradient(90deg,#FFD6E7,#E5DAFF);color:#7A3FB0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.items{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.it{border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px}
.it b{font-family:var(--round)}
.ans{color:var(--mint);font-weight:700}
.bl{display:inline-block;min-width:40px;border-bottom:2px solid var(--pink);margin:0 3px;transform:translateY(-3px)}
.stat{display:flex;gap:22px;flex-wrap:wrap}
.stat div{font-size:12px;color:var(--muted);font-weight:700}
.stat b{display:block;font-family:var(--round);font-size:28px;color:var(--ink)}
#qr{display:grid;place-items:center;padding:16px;background:#fff}
.url{font-family:var(--round);font-weight:700;font-size:26px;text-align:center;word-break:break-all}
pre{background:#FBF7FD;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:13px;overflow:auto;white-space:pre}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:50}
.login{max-width:420px;margin:60px auto}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin-top:6px}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{border:none}}
</style>
</head>
<body>
<header><div class="hin">
  <div class="brand">國一英文練功房<small>老師端</small></div>
  <nav id="nav" hidden>
    <button data-v="rec" class="on">學生紀錄</button>
    <button data-v="acc">學生帳號</button>
    <button data-v="qr">登入 QR code</button>
    <button data-v="set">設定</button>
  </nav>
  <div class="who" id="who"></div>
</div></header>
<main id="main"><div class="card">載入中…</div></main>
<script>
"use strict";
const FIREBASE_CONFIG={apiKey:"AIzaSyAWLvYbyhq4UBdBFLYDvFgqVjTkurIBXiU",authDomain:"amc-spelling-star.firebaseapp.com",projectId:"amc-spelling-star",storageBucket:"amc-spelling-star.firebasestorage.app",messagingSenderId:"93547096256",appId:"1:93547096256:web:adef0633c4326beb30a525"};
firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(), db=firebase.firestore();
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const blank=s=>esc(s).replace(/＿＿|_{3,}/g,'<span class="bl"></span>');
const L="ABCD", RANKS=[[0,"青銅"],[100,"白銀"],[300,"黃金"],[600,"白金"],[1000,"鑽石"],[1600,"大師"]];
const rankOf=xp=>{let k=0;RANKS.forEach((r,i)=>{if(xp>=r[0])k=i});return k};
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)};
const fmt=t=>{if(!t)return "—";const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,32)}
const studentURL=()=>location.href.replace(/teacher\.html.*$/,"").replace(/[#?].*$/,"");

let DATA={V:[],M:[]}; fetch("data.json").then(r=>r.json()).then(d=>{DATA=d;if(VIEW==="rec")render()}).catch(()=>{});
const wordById=id=>DATA.V.find(v=>v.id===id), qById=id=>DATA.M.find(m=>m.id===id);
const fill=q=>{const a=q.o[L.indexOf(q.a)],parts=a.split(/;\s*/),h=blank(q.q),n=(h.match(/<span class="bl"><\/span>/g)||[]).length;
  if(n&&n===parts.length){let k=0;return h.replace(/<span class="bl"><\/span>/g,()=>`<span class="ans">${esc(parts[k++])}</span>`)}return `${h} <span class="ans">（${esc(a)}）</span>`};
const itemHTML=id=>{const w=wordById(id);if(w)return `<b>${esc(w.w)}</b>　${esc(w.z)}`;const q=qById(id);return q?fill(q):esc(id)};

let STU=[],SEC={},PROG={},RES=[],VIEW="rec",SEL=null,unsubs=[];
/* ---------- login ---------- */
function loginView(){
  $("#nav").hidden=true;$("#who").innerHTML="";
  $("#main").innerHTML=`<div class="card login"><h2>老師登入</h2><p class="note">用 Spelling Bee 老師端同一個帳號登入。</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><input type="email" id="em" placeholder="Email" autocomplete="username"><input type="password" id="pw" placeholder="密碼" autocomplete="current-password">
    <div class="err" id="err"></div><button class="btn" id="go">登入</button></div></div>`;
  const go=async()=>{try{await auth.signInWithEmailAndPassword($("#em").value.trim(),$("#pw").value)}catch(e){$("#err").textContent="帳號或密碼不對"}};
  $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};
}
auth.onAuthStateChanged(u=>{
  unsubs.forEach(f=>f());unsubs=[];
  if(!u)return loginView();
  $("#nav").hidden=false;$("#who").innerHTML=`${esc(u.email)}　<button class="linkbtn" id="lo">登出</button>`;$("#lo").onclick=()=>auth.signOut();
  const err=e=>{$("#main").innerHTML=`<div class="card"><h2>讀不到資料</h2><p>Firebase 規則可能還沒加上練功房的部分。請到「設定」複製規則，貼到 Firebase。</p><p class="note">錯誤：${esc(e.code||e.message)}</p></div>`;VIEW="set";render()};
  unsubs.push(db.collection("g7_students").onSnapshot(s=>{STU=s.docs.map(d=>({sid:d.id,...d.data()})).sort((a,b)=>(a.cls||"").localeCompare(b.cls||"")||a.name.localeCompare(b.name));render()},err));
  unsubs.push(db.collection("g7_secrets").onSnapshot(s=>{SEC={};s.docs.forEach(d=>SEC[d.id]=d.data().pw);if(VIEW==="acc")render()},()=>{}));
  unsubs.push(db.collection("g7_progress").onSnapshot(s=>{PROG={};s.docs.forEach(d=>{const x=d.data();try{const st=JSON.parse(x.state);if(!PROG[x.sid]||(x.t||0)>(PROG[x.sid].t||0))PROG[x.sid]={...st,t:x.t,key:d.id}}catch(e){}});if(VIEW==="rec")render()},()=>{}));
  unsubs.push(db.collection("g7_results").orderBy("t","desc").limit(3000).onSnapshot(s=>{RES=s.docs.map(d=>({id:d.id,...d.data()}));if(VIEW==="rec")render()},()=>{}));
  render();
});
$$("#nav button").forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;$$("#nav button").forEach(x=>x.classList.toggle("on",x===b));render()});
function render(){
  if(!auth.currentUser)return;
  if(document.activeElement&&document.activeElement.closest("#main")&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  ({rec:renderRec,acc:renderAcc,qr:renderQR,set:renderSet})[VIEW]();
}

/* ---------- 學生紀錄 ---------- */
function stats(st){
  const P=PROG[st.sid]||{}, R=RES.filter(r=>r.sid===st.sid), wk=Date.now()-7*864e5;
  const W=(P.wrong||[]).filter(x=>x.kind!=="mc"), M=(P.wrong||[]).filter(x=>x.kind==="mc");
  return {P,R,week:R.filter(r=>r.t>wk).length,last:R[0]?R[0].t:P.t,W,M,acc:R.length?Math.round(R.filter(r=>!/複習/.test(r.mode)).reduce((a,r)=>a+(r.total?r.right/r.total:0),0)/Math.max(1,R.filter(r=>!/複習/.test(r.mode)).length)*100):null};
}
function renderRec(){
  const cls=[...new Set(STU.map(s=>s.cls||""))];
  const f=window._cls??"全部";
  const list=STU.filter(s=>f==="全部"||(s.cls||"")===f);
  $("#main").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">學生練習紀錄</h2>
    ${cls.length>1?`<select id="cf">${["全部",...cls].map(c=>`<option ${c===f?"selected":""}>${esc(c||"（沒分班）")}</option>`).join("")}</select>`:""}</div>
    <p class="note" style="margin:6px 0 10px">點一位學生，看他還不會的單字、文法錯題和每次練習。</p>
    ${STU.length?`<div class="tw"><table><tr><th>名字</th><th>班級</th><th>課本</th><th>段位</th><th>星星</th><th>連續天數</th><th>7 天內練習</th><th>平均答對率</th><th>還不會的單字</th><th>文法錯題</th><th>最後練習</th></tr>
    ${list.map(s=>{const x=stats(s);const r=rankOf(x.P.xp||0);return `<tr class="click ${SEL===s.sid?"sel":""}" data-sid="${s.sid}"><td><b>${esc(s.name)}</b></td><td>${esc(s.cls||"")}</td><td>${esc(s.book||"")}</td>
      <td><span class="pill r${r}">${RANKS[r][1]}</span> <span class="note">${x.P.xp||0} XP</span></td><td class="num">${x.P.stars||0}</td><td class="num">${x.P.streak||0}</td><td class="num">${x.week}</td>
      <td class="num">${x.acc==null?"—":x.acc+"%"}</td><td class="num ${x.W.length?"bad":""}">${x.W.length}</td><td class="num ${x.M.length?"bad":""}">${x.M.length}</td><td>${fmt(x.last)}</td></tr>`}).join("")}</table></div>`
    :`<p>還沒有學生，請到「學生帳號」新增。</p>`}</div>
    ${SEL?detailHTML(STU.find(s=>s.sid===SEL)):""}
    <div class="card"><h2>最近的練習</h2><div class="tw"><table><tr><th>時間</th><th>名字</th><th>任務</th><th>範圍</th><th>結果</th><th>錯的</th></tr>
    ${RES.slice(0,40).map(r=>`<tr><td>${fmt(r.t)}</td><td>${esc(r.name)}</td><td>${esc(r.mode)}</td><td>${esc(r.book)}・${esc(r.lesson)}</td><td class="num">${r.right} / ${r.total}</td><td class="${(r.miss||[]).length?"bad":"good"}">${(r.miss||[]).length||"全對"}</td></tr>`).join("")||`<tr><td colspan="6" class="note">還沒有練習紀錄</td></tr>`}</table></div></div>`;
  if($("#cf"))$("#cf").onchange=e=>{window._cls=e.target.value==="（沒分班）"?"":e.target.value;renderRec()};
  $$("tr.click").forEach(t=>t.onclick=()=>{SEL=SEL===t.dataset.sid?null:t.dataset.sid;renderRec();if(SEL)$("#detail").scrollIntoView({behavior:"smooth"})});
}
function detailHTML(s){
  if(!s)return "";const x=stats(s);
  const W=x.W.slice().sort((a,b)=>(b.n||1)-(a.n||1)), M=x.M.slice().sort((a,b)=>(b.n||1)-(a.n||1));
  return `<div class="card" id="detail"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(s.name)} 的學習狀況</h2><button class="btn ghost sm" id="closeD">關閉</button></div>
    <div class="stat" style="margin:12px 0 16px"><div>段位<b>${RANKS[rankOf(x.P.xp||0)][1]}</b></div><div>星星<b>${x.P.stars||0}</b></div><div>連續天數<b>${x.P.streak||0}</b></div><div>總練習次數<b>${x.R.length}</b></div><div>已背單字<b>${Object.keys(x.P.learned||{}).length}</b></div></div>
    <div class="two">
      <div><h2 style="font-size:18px">還不會的單字（${W.length}）</h2><div class="items">${W.map(w=>`<div class="it">${itemHTML(w.id)}　<span class="bad">錯 ${w.n||1} 次</span></div>`).join("")||`<p class="note">沒有</p>`}</div></div>
      <div><h2 style="font-size:18px">文法錯題（${M.length}）</h2><div class="items">${M.map(w=>`<div class="it">${itemHTML(w.id)}<div class="bad" style="font-size:13px">錯 ${w.n||1} 次</div></div>`).join("")||`<p class="note">沒有</p>`}</div></div>
    </div>
    <h2 style="font-size:18px;margin-top:16px">每次練習</h2>
    <div class="tw"><table><tr><th>時間</th><th>任務</th><th>範圍</th><th>結果</th><th>錯的題目</th></tr>
    ${x.R.slice(0,60).map(r=>`<tr><td>${fmt(r.t)}</td><td>${esc(r.mode)}</td><td>${esc(r.book)}・${esc(r.lesson)}</td><td class="num">${r.right} / ${r.total}</td><td style="font-size:14px">${(r.miss||[]).map(itemHTML).join("<br>")||`<span class="good">全對</span>`}</td></tr>`).join("")||`<tr><td colspan="5" class="note">還沒有練習紀錄</td></tr>`}</table></div></div>`;
}
document.addEventListener("click",e=>{if(e.target.id==="closeD"){SEL=null;renderRec()}});

/* ---------- 學生帳號 ---------- */
function renderAcc(){
  $("#main").innerHTML=`<div class="card"><h2>新增學生</h2>
    <p class="note">每行一位：<b>班級 名字 密碼</b>（例如 H7 Maggie 1357）。沒有分班可以只寫 <b>名字 密碼</b>。名字就是學生登入時要打的英文名字。</p>
    <textarea id="bulk" rows="5" placeholder="H7 Maggie 1357&#10;H7 Amy 2468" style="margin-top:10px"></textarea>
    <div class="row" style="margin-top:10px"><label class="note">課本 <select id="bbook"><option value="">讓學生自己選</option><option>康軒</option><option>翰林</option></select></label><button class="btn" id="add">新增</button><span class="err" id="aerr"></span></div></div>
    <div class="card"><h2>學生名單</h2><p class="note" style="margin-bottom:10px">密碼只有你看得到、改得了。改完按 Enter 或點別處就會存檔。改密碼後，學生要用新密碼重新登入，練習紀錄會保留。</p>
    <div class="tw"><table><tr><th>名字</th><th>班級</th><th>課本</th><th>密碼</th><th></th></tr>
    ${STU.map(s=>`<tr><td><input type="text" data-f="name" data-sid="${s.sid}" value="${esc(s.name)}"></td><td><input type="text" data-f="cls" data-sid="${s.sid}" value="${esc(s.cls||"")}" style="width:90px"></td>
      <td><select data-f="book" data-sid="${s.sid}"><option value="">學生自選</option>${["康軒","翰林"].map(b=>`<option ${s.book===b?"selected":""}>${b}</option>`).join("")}</select></td>
      <td><input type="text" data-f="pw" data-sid="${s.sid}" value="${esc(SEC[s.sid]||"")}" style="width:110px"></td>
      <td><button class="btn ghost sm" data-del="${s.sid}">刪除</button></td></tr>`).join("")||`<tr><td colspan="5" class="note">還沒有學生</td></tr>`}</table></div></div>`;
  $("#add").onclick=async()=>{
    const lines=$("#bulk").value.split("\n").map(l=>l.trim()).filter(Boolean);const bad=[];let n=0;const book=$("#bbook").value;
    for(const l of lines){const p=l.split(/[\s,，]+/);if(p.length<2){bad.push(l);continue}const pw=p.pop();const cls=p.length>=2?p.shift():"";const name=p.join(" ");
      if(pw.length<3||!name){bad.push(l);continue}
      const ref=db.collection("g7_students").doc();await ref.set({name,cls,book,t:Date.now()});await db.collection("g7_secrets").doc(ref.id).set({pw});n++}
    $("#bulk").value=bad.join("\n");$("#aerr").textContent=bad.length?`有 ${bad.length} 行格式不對（密碼至少 3 個字）`:"";if(n)toast(`已新增 ${n} 位學生`);
  };
  $$("[data-f]").forEach(el=>el.onchange=async()=>{
    const sid=el.dataset.sid,f=el.dataset.f,v=el.value.trim();
    try{
      if(f==="pw"){if(v.length<3){toast("密碼至少 3 個字");el.value=SEC[sid]||"";return}const old=SEC[sid];await db.collection("g7_secrets").doc(sid).set({pw:v});await movePw(sid,old,v);toast("密碼已更新 ✓")}
      else{if(f==="name"&&!v)return;await db.collection("g7_students").doc(sid).update({[f]:v});toast("已更新 ✓")}
    }catch(e){toast("沒有存到："+(e.code||e.message))}
  });
  $$("[data-del]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="確定刪除？";b.classList.add("red");b.style.color="#fff";return}
    const sid=b.dataset.del;try{await db.collection("g7_students").doc(sid).delete();await db.collection("g7_secrets").doc(sid).delete();toast("已刪除（練習紀錄保留）")}catch(e){toast("刪除失敗")}
  });
}
/* 改密碼時，把雲端進度搬到新密碼的位置 */
async function movePw(sid,oldPw,newPw){
  const s=await db.collection("g7_progress").where("sid","==",sid).get();
  let best=null;s.docs.forEach(d=>{const x=d.data();if(!best||(x.t||0)>(best.data().t||0))best=d});
  if(!best)return;const key=await sha(sid+"|"+newPw);
  await db.collection("g7_progress").doc(key).set({...best.data(),pw:newPw});
  for(const d of s.docs)if(d.id!==key)await d.ref.delete();
}

/* ---------- 設定（Firebase 規則） ---------- */
function rulesText(email){return `    // ===== 國一英文練功房 =====
    function g7Teacher() {
      return request.auth != null && request.auth.token.email == '${email}';
    }
    function g7PwOk(sid) {
      return exists(/databases/$(database)/documents/g7_secrets/$(sid))
        && get(/databases/$(database)/documents/g7_secrets/$(sid)).data.pw == request.resource.data.pw;
    }
    match /g7_students/{sid} { allow read: if true; allow write: if g7Teacher(); }
    match /g7_secrets/{sid}  { allow read, write: if g7Teacher(); }
    match /g7_login/{sid}    { allow read, delete: if g7Teacher(); allow create, update: if g7PwOk(sid); }
    match /g7_progress/{key} {
      allow get: if true;
      allow list, delete: if g7Teacher();
      allow create, update: if g7Teacher() || (request.resource.data.sid is string && g7PwOk(request.resource.data.sid));
    }
    match /g7_results/{id} {
      allow read, delete: if g7Teacher();
      allow create: if request.resource.data.sid is string && g7PwOk(request.resource.data.sid);
    }`}
function renderSet(){
  const email=auth.currentUser.email;
  $("#main").innerHTML=`<div class="card"><h2>Firebase 規則（第一次使用要設定）</h2>
    <p>練功房和 Spelling Bee、充電大作戰用同一個 Firebase，所以<b>不要把原本的規則刪掉</b>，只要把下面這段<b>加進去</b>：</p>
    <ol><li>打開 Firebase → Firestore Database → 規則</li><li>找到最後面的兩個 <code>}</code>，把下面這段貼在它們<b>前面</b></li><li>按「發布」</li></ol>
    <div class="row" style="margin-bottom:8px"><button class="btn" id="cr">複製規則</button><a class="btn ghost" href="https://console.firebase.google.com/project/amc-spelling-star/firestore/rules" target="_blank" rel="noopener">打開 Firebase 規則頁</a></div>
    <pre id="rules">${esc(rulesText(email))}</pre></div>`;
  $("#cr").onclick=async()=>{try{await navigator.clipboard.writeText(rulesText(email));toast("規則已複製")}catch(e){toast("無法複製，請手動選取")}};
}
