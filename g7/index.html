d ˋgrit","p":"名","z":"見面會"},{"id":"hl4w-039","b":"翰林","s":"第四課","w":"stage","k":"stedʒ","p":"名","z":"舞台"}],"M":[{"id":"kx-001","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Cathy: Can’t you play basketball after school?  Doris: Yes, I  ＿＿.","o":["can","can’t","cannot","can not"],"a":"A","e":"如果 Doris 可以打籃球，要說「Yes, I can.」；如果 Doris 不能打籃球，則要回答：「No, I can’t.」，答案選(Ａ)。"},{"id":"kx-002","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: Where are your dad and mom?  B: They are ＿＿ the museum.","o":["at","under","between","on"],"a":"A","e":"“at the museum” 意謂「在博物館」附近。"},{"id":"kx-003","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Mark: ＿＿ is Susan from?  Neil: She is from Taiwan.","o":["What","When","Where","Why"],"a":"C","e":"來自何處用 Where 詢問。"},{"id":"kx-004","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Cindy: Can your brother swim underwater for a long time?  Benny: No, ＿＿.","o":["my brother can","he isn’t","he is","he can’t"],"a":"D","e":"用 can 問就用 can 回答。簡答時需將主詞改為代名詞，答案選(Ｄ)。"},{"id":"kx-005","b":"康軒","s":"第三、四課","t":"文法選擇","q":"I can’t help you, but Ben ＿＿.","o":["can’t","can","is","isn’t"],"a":"B","e":"but 連接兩個語意相反的句子，前句有助動詞 can’t，後句則要用 can。"},{"id":"kx-006","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Heidi: Where is your bedroom?  Simon: It’s ＿＿ the bathroom and my parents’ bedroom.","o":["in","around","at","between"],"a":"D","e":"between A and B：在 A 和 B 之間。"},{"id":"kx-007","b":"康軒","s":"第三、四課","t":"文法選擇","q":"The dog is between ＿＿.","o":["the river","near my school","the houses","and the castle"],"a":"C","e":"between＋複數名詞；between A and B。"},{"id":"kx-008","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ late.  Let’s hurry（趕快）.","o":["Don’t be","Not be","Don’t","Not"],"a":"A","e":"祈使句的否定用 don’t。"},{"id":"kx-009","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Mandy ＿＿ swim, but she can catch fish.","o":["can’t","can","is","isn’t"],"a":"A","e":"but 用來連接前後語意相反的句子，後面用 can，前面就用 can’t。"},{"id":"kx-010","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Allen: ＿＿  Sue play baseball?  Ben: No, she can’t.","o":["Am","Can","Is","Are"],"a":"B","e":"回答 can’t，表示是問能力，用助動詞 can。"},{"id":"kx-011","b":"康軒","s":"第三、四課","t":"文法選擇","q":"The dining room is between the kitchen ＿＿ my grandparents’ room.","o":["and","to","of","or"],"a":"A","e":"between 和 and 搭配使用。"},{"id":"kx-012","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: ＿＿ is your brother?  B: He’s in the kitchen.","o":["What","How","Where","Who"],"a":"C","e":"句意：A：妳弟弟在「哪裡」？B：他在廚房裡。"},{"id":"kx-013","b":"康軒","s":"第三、四課","t":"文法選擇","q":"The monkey is in front of me.  I’m ＿＿ the monkey.","o":["behind","near","around","next to"],"a":"A","e":"in front of 的相對詞為 behind。"},{"id":"kx-014","b":"康軒","s":"第三、四課","t":"文法選擇","q":"My sister can read English books, but my brother ＿＿.","o":["can’t","isn’t","not","aren’t"],"a":"A","e":"but 連接兩個語意相反的句子，前句用 can，後句則要用 can’t。"},{"id":"kx-015","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Please ＿＿ talk.  Listen ＿＿ the teacher.","o":["don’t; to","not; to","don’t; ×","not; ×"],"a":"A","e":"祈使句的否定句用 don’t，listen to＋受詞。"},{"id":"kx-016","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Joan lives（住）＿＿ Ben.  They are neighbors（鄰居）.","o":["between","outside","next to","in the front of"],"a":"C","e":"Joan 和 Ben 是鄰居，表示兩人住「隔壁」，用 next to。"},{"id":"kx-017","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Rick: I can’t swim（游泳）.  ＿＿ you?  Dave: Sure.  It’s a piece of cake（非常簡單的事）for me.","o":["Can","Can’t","Are","Aren’t"],"a":"A","e":"Rick 表示不會游泳。接著問 Dave「你會嗎？」Dave 表明「當然會。對我而言是非常簡單的事。」。"},{"id":"kx-018","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Please don’t ＿＿ angry, Irene.","o":["am","are","is","be"],"a":"D","e":"don’t 後面接原形動詞，形容詞 angry（生氣的）之前要有 be 動詞。"},{"id":"kx-019","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Her cellphone is next ＿＿ the toy car.","o":["×","of","to","and"],"a":"C","e":"next 和 to 搭配使用。"},{"id":"kx-020","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Howard can sing well, but his sister ＿＿.","o":["can’t","can","is","isn’t"],"a":"A","e":"用連接詞 but 連接，前後句語意應為相反，故選(Ａ)。"},{"id":"kx-021","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: ＿＿ is your teacher from? B: She’s from Africa.","o":["Who","Where","How","What"],"a":"B","e":"由答句「她來自非洲。」可知，前句是在問「你的老師來自哪裡？」，故選(Ｂ)。"},{"id":"kx-022","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ make any noise.  Be quiet.","o":["Don’t","Aren’t","Not","No"],"a":"A","e":"祈使句的否定句用 don’t。"},{"id":"kx-023","b":"康軒","s":"第三、四課","t":"文法選擇","q":"It’s late now.  Let’s ＿＿.","o":["go home","don’t go home","going home","not be home."],"a":"A","e":"現在時間晚了。我們「回家」吧。Let’s＋原形動詞。"},{"id":"kx-024","b":"康軒","s":"第三、四課","t":"文法選擇","q":"I can climb trees, but my sisters＿＿.","o":["are","isn’t","can","can’t"],"a":"D","e":"but 用來連接前後語意相反的句子，前面用 can，後面就用 can’t。"},{"id":"kx-025","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Adam: ＿＿ go to the car show（展示）.  Isabel: Sorry, I can’t（不能）.","o":["Not","Let’s","Do","Be"],"a":"B","e":"Adam 邀 Isabel 一起去看車展，用 let’s＋原形動詞...。"},{"id":"kx-026","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Howard can play baseball, but his sister ＿＿.","o":["can’t","can","is","isn’t"],"a":"A","e":"用連接詞 but 連接，前後句語意應為相反，故選(Ａ)。"},{"id":"kx-027","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Please don’t ＿＿ sad.","o":["be","has","is","×"],"a":"A","e":"don’t 後面接原形動詞，形容詞 sad（傷心的）之前要加進 be 動詞。"},{"id":"kx-028","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Jane: Who can go with me?  Ben: I sure ＿＿.  I’m your good husband.","o":["can","can’t","am","am not"],"a":"A","e":"問句中有助動詞 can，簡答句中仍用 can 作答。"},{"id":"kx-029","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ down and ＿＿ your books.","o":["Sit; opens","Sit; open","To sit; to open","Sits; opens"],"a":"B","e":"用 and 連接兩個祈使句的原形動詞。"},{"id":"kx-030","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Please ＿＿ nice to your brother.","o":["be","is","do","am"],"a":"A","e":"nice 為形容詞，搭配的動詞為 be。"},{"id":"kx-031","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Yuhlee: Sit down, ＿＿.  James: Thank you.","o":["please","don’t","do","Lily"],"a":"A","e":"please 可放句尾。"},{"id":"kx-033","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Andy: Where are you?  Brian: We are ＿＿ the living room.","o":["under","between","in","on"],"a":"C","e":"在客廳裡面，用介系詞 in。"},{"id":"kx-034","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Mia: ＿＿ is Jacob?  Ted: He’s in the dining room.","o":["Where","How","Who","What"],"a":"A","e":"由 Ted 的答句可知 Mia 在問 Jacob 人在哪裡，所以用疑問詞 where。"},{"id":"kx-035","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Mrs. Lin: ＿＿ are the animals from?  Tim: They’re from Australia.","o":["How","Where","How old","Who"],"a":"B","e":"Where... from?：…從哪裡來？"},{"id":"kx-036","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: Can your dog catch a ball?  B: Yes, it ＿＿.","o":["can","is","can catch","can’t"],"a":"A","e":"以助動詞 can 引導的 Yes / No 問句，要使用 can 來簡答。"},{"id":"kx-037","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A bicycle（腳踏車）is ＿＿ front ＿＿ Mr. Wang’s car.","o":["at; and","in; to","at; of","in; of"],"a":"D","e":"in front of（在…前面）。"},{"id":"kx-038","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Mom: Landy, where is your brother?  Landy: Oh, he is in front ＿＿ the house.","o":["of","to","about","on"],"a":"A","e":"in front of：在…的前面。"},{"id":"kx-039","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Those actresses are Taiwanese.  They are ＿＿ Taiwan.","o":["of","from","at","in"],"a":"B","e":"表示「從何處而來」，介系詞用 from。那些女演員是臺灣人。她們來自臺灣。"},{"id":"kx-040","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A parrot can’t swim, but it ＿＿ speak.","o":["is","isn’t","can","can’t"],"a":"C","e":"but 用來連接前後語意相反的句子，前面用 can’t，後面就用 can。"},{"id":"kx-041","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ happy.  ＿＿ sad.  We should be happy every day.","o":["Be; Isn’t","Be; Don’t be","Don’t be; Don’t be","Don’t be; Be"],"a":"B","e":"快樂點。不要傷心。我們每天都應該要開心。形容詞（happy, sad）前加上原形動詞 be 形成祈使句，否定祈使句前加上 don’t。"},{"id":"kx-042","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Welcome ＿＿ my home.  Please come in.","o":["of","×","by","to"],"a":"D","e":"welcome to＋地方：歡迎到某地。"},{"id":"kx-043","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ a bad student.  ＿＿ a good boy at home.","o":["Be; Don’t be","Be; Be","Don’t be; Be","Don’t be; Don’t be"],"a":"C","e":"第一句是「否定」祈使句，第二句則是「肯定」祈使句。"},{"id":"kx-044","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Bob: Who ＿＿ cook in your family?  Emi: My dad ＿＿.  He is a handsome good cook.","o":["can; can","can’t; can’t","can; can’t","can’t; can"],"a":"A","e":"Bob 詢問 Emi「妳家中誰會煮飯？」Emi 以「我爸爸會。」回應，Emi 並稱讚她爸爸是個帥氣的好廚師呢。兩空格皆用肯定助動詞作答。"},{"id":"kx-045","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Stella: What can Jacky do?  Hebe: He ＿＿ jump high and swim.","o":["are","is","can","be"],"a":"C","e":"用 can 問，就用 can 回答。"},{"id":"kx-046","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: Can you dance and ＿＿?  B: Yes, we can.","o":["singing","sing","to sing","be singing"],"a":"B","e":"前有助動詞 can，後面接原形動詞。"},{"id":"kx-047","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Tank: ＿＿ in the kitchen?  Lola: My grandma is.","o":["Who is","What is","Where is","How is"],"a":"A","e":"由答句可知 Tank 是問「誰」在廚房裡。"},{"id":"kx-048","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Jin: ＿＿ your sister?  Dan: In the bathroom.","o":["What’s","What","Where’s","Where"],"a":"C","e":"Jin 問 Dan 有關他姐姐人在哪裡，Dan 回答在浴室裡。"},{"id":"kx-049","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Please ＿＿ play with chopsticks.","o":["no","don’t","not","aren’t"],"a":"B","e":"祈使句前加上 don’t 形成否定祈使句。"},{"id":"kx-050","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Please ＿＿ run in the classroom.","o":["not","don’t","not to","doesn’t"],"a":"B","e":"「不要」在教室奔跑。否定的祈使句句型用 don’t＋原形 V。"},{"id":"kx-051","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Please ＿＿ talk in the library.","o":["not","don’t","not to","doesn’t"],"a":"B","e":"否定的祈使句句型用 don’t＋原形動詞。"},{"id":"kx-052","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Where ＿＿ your books?","o":["are","is","am","not"],"a":"A","e":"books 是複數，搭配動詞 are。"},{"id":"kx-053","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ sleep in class.","o":["Please don’t","Don’t please,","Don’t please","Please not"],"a":"A","e":"祈使句的否定要將 “don’t” 放在動詞前面，而不是放在 please 前面。Please don’t sleep in class.＝Don’t sleep in class, please."},{"id":"kx-054","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: Please ＿＿ quiet.  B: I’m sorry.","o":["is","you are","be","are"],"a":"C","e":"句意：A：請安靜。B：抱歉。祈使句應使用原形動詞。"},{"id":"kx-055","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Mr. Chen: ＿＿ quiet, please.  Students: Yes, Mr. Chen.","o":["Let’s","Are","Be","Don’t"],"a":"C","e":"quiet 為形容詞，在祈使句中搭配原形動詞 be。"},{"id":"kx-056","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Dola: ＿＿ is your sister?  Sara: She’s in the bathroom.","o":["How","Where","Who","What"],"a":"B","e":"問地點用疑問詞 where。"},{"id":"kx-057","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ sit down ＿＿.","o":["Please; , John","John; please","Don’t; please John","John, ; please don’t"],"a":"A","e":"please 可放句首和句尾，放句尾時前面加逗號。人名放句首或句尾時，分別在後面或前面加逗號。"},{"id":"kx-058","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Liz: My dog, Rocky, ＿＿ jump rope.  ＿＿ your dog, Money?  Sue: He can, too.  Let Rocky and Money jump rope at the park.","o":["can; Can","can’t; Can’t","can; Can’t","can’t; Can"],"a":"A","e":"由 Sue 所說 He can, too. 可推知 Liz 的狗 Rocky「會」跳繩，而 Liz 用「妳的狗 Money 會嗎？」也用肯定助動詞詢問。"},{"id":"kx-059","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: What can you and your classmates ＿＿ for Teacher’s Day?  B: We can sing a song to our teacher.","o":["doing","to do","do","does"],"a":"C","e":"助動詞 can＋原形動詞。"},{"id":"kx-060","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿, sit down, ＿＿.","o":["Please; Mike","Mike; please","Please; don’t","Don’t; Mike"],"a":"B","e":"選項(Ａ) Please 在動作前面，其後不打逗號；(Ｃ)須改成 Please don’t sit down；(Ｄ)須改成 Don’t sit down, Mike.。"},{"id":"kx-061","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ talk.  My baby sister is sleeping.","o":["Not let’s","Let’s not","Let’s don’t","No let’s"],"a":"B","e":"祈使否定句：Let’s not +原形動詞。"},{"id":"kx-062","b":"康軒","s":"第三、四課","t":"文法選擇","q":"It’s time for class.","o":["Please, class, be quiet.","Don’t be quiet, class, please.","Class, be quiet please.","Please be quiet, class."],"a":"D","e":"please 放句尾時，前面才要加逗號。"},{"id":"kx-063","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ the sheep?  Are they near the lake?","o":["Where","Where is","What are","Where are"],"a":"D","e":"由「Are they」可知是複數，由near the lake可知應搭配「where」，選(D)。"},{"id":"kx-064","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Which is NOT correct?","o":["Sam, close the windows, please.","Please close the windows, Sam.","Close the windows, Sam, please.","Sam, please close the windows."],"a":"C","e":"這四個句子都是祈使句，用來發出命令、請求或建議，通常可加入禮貌用語 please 以及稱呼對象的名字。(C) Close the windows, Sam, please. 這句把人名Sam放在句中間，再加 please 在句尾，會造成語意與語調上的混亂。"},{"id":"kx-065","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Our teacher is ＿＿ the classroom（教室）.  She’s writing（正在寫字）on the board（黑板）.","o":["in the front of","between","in front of","next to"],"a":"A","e":"in the front of 指在某範圍內的前面。"},{"id":"kx-066","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ in line and ＿＿ into the station.","o":["Stand; to go","To stand; go","Stand; go","To stand; to go"],"a":"C","e":"用 and 連接兩個原形動詞。"},{"id":"kx-067","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Mom ＿＿ cookies, but Dad can.","o":["is making","can make","isn’t making","can’t make"],"a":"D","e":"媽媽「不會」做餅乾，但爸爸會。"},{"id":"kx-068","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Jay: ＿＿ my watch?  Fanny: On the chair.","o":["What","Where","What’s","Where’s"],"a":"D","e":"由答句可知問句在問手表的位置。"},{"id":"kx-069","b":"康軒","s":"第三、四課","t":"文法選擇","q":"The castle isn’t near ＿＿ the lake.","o":["on","of","to","×"],"a":"D","e":"near＋地點名稱，不用搭配其他的介系詞。"},{"id":"kx-070","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ a song for our teacher.","o":["singing","sang","sing","sings"],"a":"C","e":"Let’s 後面接原形動詞。"},{"id":"kx-071","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Bears can catch fish, but they ＿＿ fly.（選出不正確者）","o":["can’t","cannot","can not","aren’t"],"a":"D","e":"but 連接兩個語意相反的句子，前句有助動詞 can，後句則要使用否定助動詞 can’t。can not＝can’t＝cannot。"},{"id":"kx-072","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ noise.  Everyone（每個人）is studying（正在研讀）.","o":["make","not make","don’t make","make not"],"a":"B","e":"let’s＋not＋原形動詞，為否定句。"},{"id":"kx-073","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Be quiet ＿＿.  No talking here.","o":[", please","please",", Amy please","Amy, please"],"a":"A","e":"Please be quiet, Amy.＝Amy, please be quiet.＝Amy, be quiet, please."},{"id":"kx-074","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ stand up.  Don’t sit down.","o":["Please,","Does","Please","Be"],"a":"C","e":"please 放句首時後面不必加逗號。"},{"id":"kx-075","b":"康軒","s":"第三、四課","t":"文法選擇","q":"選出語法錯誤的句子。","o":["The farmer is on the farm.","Is Mary from the UK?","Where is your friend to?","This is a postcard from Jenny."],"a":"C","e":"(C)詢問你的朋友從哪裡來要用from。"},{"id":"kx-076","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Joseph, ＿＿ a good student at school.","o":["am","are","is","be"],"a":"D","e":"Joseph 放句首後面加逗號為祈使句的用法，用 is 的原形動詞 be。"},{"id":"kx-077","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Please ＿＿.","o":["standing here, boys","not to stand here, boys","stand here, boys","be stand here, boys"],"a":"C","e":"Please (don’t)＋原形動詞＋主詞。"},{"id":"kx-078","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Helen, ＿＿ down your English name now, please.","o":["write","be write","be","is writing"],"a":"A","e":"人名後加逗點，接表示規勸、命令的祈使句，故用原形動詞。"},{"id":"kx-079","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Ivy: I’m hungry.  Coco: ＿＿ some pineapple cakes.  Ivy: Thank you.","o":["Eats","Eat","Eating","To eat"],"a":"B","e":"祈使句用原形動詞。"},{"id":"kx-080","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ eat ＿＿ drink on the metro.","o":["Do; or","Don’t; or","Please, don’t; and","Let’s don’t; and"],"a":"B","e":"由metro可知是否定祈使句，不要吃或喝，所以選(B)。"},{"id":"kx-081","b":"康軒","s":"第三、四課","t":"文法選擇","q":"The man can’t ＿＿ a student.  He looks like a teacher.","o":["be","is","am","are"],"a":"A","e":"助動詞 can 後加上原形動詞。"},{"id":"kx-082","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Everything will（將會）be okay!  ＿＿ sad!","o":["Be not","Let’s not","Don’t be","Don’t"],"a":"C","e":"「sad」是形容詞，搭配be動詞的否定祈使句，選(C)。"},{"id":"kx-083","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Leo: Is Uncle Jerry from the USA?  Brett:","o":["No, he is.","Yes, he’s.","Yes, he’s from the UK, too.","Yes, he’s from the USA."],"a":"D","e":"回答 Uncle Jerry 來自美國，故選(Ｄ)。"},{"id":"kx-084","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: ＿＿ you two ＿＿?  I can’t hear（聽見）anything（任何事物）now.  B: Sorry.","o":["Aren’t; quiet","Are; be quiet","Can’t; quiet","Can’t; be quiet"],"a":"D","e":"根據前後句內容，此句應用表「可以...？」的Can問句，助動詞放句首時，後接原形動詞，quiet為形容詞「安靜的」，前面需有be動詞，故選D。"},{"id":"kx-085","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: No toys for you.  B: Hey, ＿＿ your brother.","o":["be welcome to","be nice to","talk to","stand up"],"a":"B","e":"“be nice to＋人” 意謂「對某人好」。"},{"id":"kx-086","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ Mike to our party.","o":["invite","inviting","to invite","be inviting"],"a":"A","e":"Let’s 後面接原形動詞。"},{"id":"kx-087","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Jill: ＿＿ you play basketball?  Lisa: No, but I ＿＿ jump rope.","o":["Can; ×","Can’t; ×","Can; can’t","Can’t; can"],"a":"D","e":"第一空格可用 Can 或 Can’t；第二空格，因已有 No 回答，表示「不會打籃球」，而 but 要連接語意相反，故選「會跳繩」。"},{"id":"kx-088","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A:  ＿＿, come on in, ＿＿.  B: Wow.  What a beautiful house!","o":["Tina; please","Please; Tina","Tina; Please","please; Tina"],"a":"A","e":"Please come on in, Tina.＝Tina, please come on in.＝Tina, come on in, please."},{"id":"kx-089","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: Where is Tanya ＿＿? B: The USA.","o":["to","of","from","for"],"a":"C","e":"“Where... from?” 意謂「…來自於哪裡？」。"},{"id":"kx-090","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Just ＿＿ your eyes and ＿＿ some rest.","o":["closed; got","closing; getting","closes; gets","close; get"],"a":"D","e":"Just（就；只）常放在祈使句句首，故其後接兩個原形 V... 的句型。"},{"id":"kx-091","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Peter, ＿＿ bring ＿＿ food with you.  The food is on Linda.","o":["don’t; any","×; some","do; any","let’s; any"],"a":"A","e":"Linda 會帶食物，所以 Peter 不需要帶任何食物。句子表否定時用 any；肯定用 some。"},{"id":"kx-092","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Shhh!  My grandfather is sleeping（正在睡著）＿＿ his bedroom.","o":["under","on","in","between"],"a":"C","e":"in one’s bedroom：在某人的臥室裡。"},{"id":"kx-093","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: ＿＿ be sad, my friend.  I’m right here ＿＿ you.  B: Thanks.","o":["No; with","Can’t; and","Can’t; with","Don’t; with"],"a":"D","e":"表「建議」時用祈使句，建議某人做某事或不要做某事，以原形動詞為首，而此句文意應為我的朋友「不要」傷心，因此用否定形Don’t開頭；with表「和...」，故選D。"},{"id":"kx-094","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Mom, please let me ＿＿ watch TV first.","o":["to go","going","goes","go"],"a":"D","e":"let（讓）之後的動作用原形動詞。"},{"id":"kx-095","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ talk.","o":["not to","don’t","doesn’t","not"],"a":"D","e":"Let’s not talk.：我們不要講話。"},{"id":"kx-096","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Gary: Who can open the big box?  Elsa: My uncle ＿＿ it.","o":["can not open","can opens","can open","can’t open"],"a":"C","e":"Gary 問誰能打開這個大箱子？ Elsa 回答她的叔叔「能打開」它。"},{"id":"kx-097","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ to that new classmate.","o":["be nice","don’t fight","not wait","do not look"],"a":"A","e":"我們「善待」那位新同學吧。句子是「Let's ______ to that new classmate.」，屬於祈使句用法，Let's 後面要接原形動詞。選項(Ｂ)須改成 Let’s not fight with that...；選項(Ｃ) wait 之後的介系詞為 for；選項(Ｄ) do 須去掉，而且 look 之後的介系詞為 at。"},{"id":"kx-098","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Our PE teacher is ＿＿ the students.","o":["near to","next","in front","between"],"a":"D","e":"between 除了搭配 and 外，也可以用 between＋複數名詞。"},{"id":"kx-099","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ go to the zoo.  It’s four o’clock.  It’s late.","o":["not","don’t","no","not be"],"a":"A","e":"祈使句 “Let’s＋not＋原形動詞” 意謂「我們不要…」。"},{"id":"kx-100","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Peggy: Hello, Mike.  Is Jessy ＿＿ Taipei?  Mike: Yes, Taipei is her hometown.","o":["in","on","at","from"],"a":"D","e":"由 Mike 回答「臺北是她的家鄉。」，可知是在問來自何處，詢問「來自哪裡」的介系詞用 from。"},{"id":"kx-101","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Please ＿＿ there.  Wait here.","o":["not come","not go","don’t come","don’t go"],"a":"D","e":"Please 之後可接（don’t）＋原形 V...，而只能用 come here（來這裡），go there（去那裡）。"},{"id":"kx-102","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ a song for our teacher.","o":["singing","sang","sing","be singing"],"a":"C","e":"let’s 後面接原形動詞。"},{"id":"kx-103","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Amy: What can Mark do?  Bill: He can ＿＿ everything.","o":["is moving","be move","to move","move"],"a":"D","e":"助動詞 can 後面接原形動詞。"},{"id":"kx-104","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ run.  Sit down and take a rest（休息一下）.","o":["no","aren’t","don’t","not"],"a":"D","e":"let’s...  的否定句直接在 let’s 的後面加 not。"},{"id":"kx-105","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ to ＿＿.","o":["talking; her","talk; she","talk; her","talking; she"],"a":"C","e":"Let’s 後加上原形動詞。介系詞後加上受格。"},{"id":"kx-106","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Julian, ＿＿ a bad student.","o":["am not","don’t be","is","not be"],"a":"B","e":"祈使句用原形動詞，be 在此譯為「當」。祈使句前加上 don’t 形成否定祈使句。"},{"id":"kx-107","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: Cathy is late!  B: ＿＿  Look!  She’s coming.","o":["Don’t be angry.","Let’s be angry.","Please don’t be late.","She’s late."],"a":"A","e":"句意：A：Cathy 遲到了！B：「不要生氣。」看！她來了。"},{"id":"kx-108","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Choose the correct one.","o":["Please, Amy, put down your hand.","Don’t say that, please, Joe.","Don’t let’s wait here, please.","Never be late for work, Kyle."],"a":"D"},{"id":"kx-109","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Which（哪一個）is right?","o":["It’s cold. Let’s don’t open the windows.","Peter is waking up and getting up now.","Please be on time. Don’t late for work, Ryan.","Look! There are two girls reading in the classroom."],"a":"D"},{"id":"kx-110","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Jim’s pencil is ＿＿ ＿＿.","o":["in; box","under; the box","between; the eraser","in front; book"],"a":"B","e":"表示位置用介系詞＋the / 所有格＋地點名稱。between 不搭配 and 時，後面的名詞要用複數。"},{"id":"kx-111","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: The coffee shop is just ＿＿ here.  Let’s go there and drink some coffee.  B: Bean Coffee Shop?  A: Yes.  B: Let’s walk!","o":["behind of","near","front of","on"],"a":"B","e":"「在這附近」所以用走的即可，故選(Ｂ)。"},{"id":"kx-112","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: Where are the flowers?  B: They’re ＿＿ the dining table.","o":["in","on","at","between"],"a":"B","e":"句意：A：那些花在哪裡？B：它們「在」餐桌「上」。"},{"id":"kx-113","b":"康軒","s":"第三、四課","t":"文法選擇","q":"My father is ＿＿.  He is by（在…旁邊）the lake.","o":["behind","under","in front of","outside"],"a":"D","e":"outside 具副詞特性，可單獨放句尾。"},{"id":"kx-114","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: ＿＿ Kevin’s and Sean’s houses?  B: Kevin’s house is near the school, and Sean’s house is next to the train station（火車站）.","o":["Where’s","What’s","Where are","What are"],"a":"C","e":"因主詞「Kevin’s and Sean’s houses」為兩人各自的房子，所以應搭配複數be動詞「are」，由回答中的「near the school」和「next to the train station」可知疑問詞應選「where」，答案為(C)。"},{"id":"kx-115","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ use forks.  Just use our hands.","o":["don’t be","not","don’t to","not be"],"a":"B","e":"Let’s 後接 not＋原形動詞，形成否定句。"},{"id":"kx-116","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Ben, ＿＿ a bad student.  Your dad and mom are sad.","o":["don’t","not be","be","don’t be"],"a":"D","e":"be 在此作「當」解。句意：Ben，「別當」個壞學生。你的爸媽會傷心的。"},{"id":"kx-117","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Jill: ＿＿ you roller-skate?  Lisa: No, but I ＿＿ jump rope.","o":["Can; ×","Can’t; ×","Can; can’t","Can’t; can"],"a":"D","e":"第一空格可用 Can 或 Can’t；第二空格，因已有 No 回答，表示「不會溜冰」，而 but 要連接語意相反，故選「會跳繩」。"},{"id":"kx-118","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Kevin ＿＿ to Peter.  Let’s ＿＿ to Peter, too.","o":["is talking; talk","is talking; talking","is talk; talk","talk; is talking"],"a":"A","e":"第三人稱單數主詞加上 is 及現在分詞形成現在進行式。let’s 後面加上原形動詞。"},{"id":"kx-119","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Your toys are ＿＿ table, not on it.","o":["on the","under the","on","under"],"a":"B","e":"玩具在桌下而不是在桌上，用 under＋the＋地點名稱（table）。"},{"id":"kx-120","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Here ＿＿.  Let’s ＿＿ into it.","o":["the museum is; go","is the museum; go","the museum is; to go","is the museum; to go"],"a":"B","e":"here 倒裝句的主詞若是一般名詞，則為 Here＋動詞＋主詞。let’s＋（not）＋原形動詞。"},{"id":"kx-121","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Sara: Can’t your mom play tennis?  Beth: No, she ＿＿, but my dad ＿＿.","o":["isn’t; is","can; can’t","is; isn’t","can’t; can"],"a":"D","e":"否定簡答 Can’t 開頭的問句，須用 can’t，而連接詞 but 則連接語氣相反的簡述句，仍須用 can。"},{"id":"kx-122","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Hugo: Eric, ＿＿ a seat.  Eric: OK.","o":["you take","take","to take","takes"],"a":"B","e":"祈使句省略主詞 you，並用原形動詞。"},{"id":"kx-123","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: The swimming pool is in front of the garage.  B: That is, the garage is ＿＿ the swimming pool.  A: That’s right.","o":["between","in","behind","near"],"a":"C","e":"“in front of...” 意謂「在…前面」，相反詞為 behind（在…後面）。"},{"id":"kx-124","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: The pen is on the book, and there is a pencil near the book.  Where is the ruler?  B: Open the book.  Maybe it’s ＿＿ the book.  A: Oh, yes.  You are right.","o":["under","in","on","near"],"a":"B","e":"叫對方打開書，故推斷應是在書「裡面」。"},{"id":"kx-125","b":"康軒","s":"第三、四課","t":"文法選擇","q":"The baby can ＿＿ now.  His mother is so surprised.","o":["be walking","walk","walking","walks"],"a":"B","e":"助動詞 can＋原形動詞。"},{"id":"kx-126","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Hurry up!  ＿＿ late for the meeting.  The boss will not be happy with it.","o":["Not","Don’t be","Don’t","No"],"a":"B","e":"遲到be late，祈使句否定應使用助動詞，選(B)。"},{"id":"kx-127","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Willy: Where ＿＿ the fish?  Rola: They’re ＿＿ lake.","o":["are; in the","are; in","is; in the","is; in"],"a":"A","e":"由答句的 They’re 可知 fish（魚）在此表複數，用動詞 are。描述位置則用介系詞＋the ／所有格＋地點。"},{"id":"kx-128","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Kyle, ＿＿ a good student.","o":["is","be","are","am"],"a":"B","e":"祈使句用原形動詞，be 在此譯為「當」。"},{"id":"kx-129","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: Where are the hippos?  B: ＿＿ in the swimming pool.  It’s so hot today.","o":["There are","These are","They are","There is"],"a":"C","e":"主詞是 “the hippos”，人稱代名詞用 they，故選(Ｃ)。"},{"id":"kx-130","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ a map（地圖）with（和…一起）you when（當…的時候）you go to a place for the first time（第一次）.〔106.會考〕","o":["Have taken","Take","Taking","To take"],"a":"B","e":"當你第一次去一個地方時，要隨身帶張地圖，是「祈使句」，故用原形動詞開頭。"},{"id":"kx-131","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Where is ＿＿ kitchen?","o":["the","in the","in","in your"],"a":"A","e":"廚房是特定的場所，不屬於個人的，故只須用 the kitchen 即可。"},{"id":"kx-132","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Don’t eat ＿＿ drink on the bus.","o":["×","and","so","or"],"a":"D","e":"公車上不要吃「或」喝。or 出現在否定句，即「兩動作都不要做」。"},{"id":"kx-133","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Anna: ＿＿ your sister ride a bike?  Belinda: Yes.","o":["Are","Is","Am","Can"],"a":"D","e":"ride 是原形動詞，表示前面須用助動詞而非 be 動詞，故選(Ｄ)。"},{"id":"kx-134","b":"康軒","s":"第三、四課","t":"文法選擇","q":"選出語法正確的句子。","o":["Where’s my postcards?","Where are my cat?","She’s not from the Japan.","Ben and Bill are father and son."],"a":"D"},{"id":"kx-135","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: Where are ＿＿?  B: They are in front of the bamboo trees.","o":["a panda","pandas","the panda","the pandas"],"a":"D","e":"由問句有 be 動詞 are，可知接複數名詞。因指特定物，所以名詞前要加所有格或冠詞，故選(Ｄ)。"},{"id":"kx-136","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ be late to the party（派對）.  It’s impolite（不禮貌的）.","o":["×","isn’t","don’t","not"],"a":"D","e":"Let’s not＋原形動詞，為 Let’s...  句型的否定句。"},{"id":"kx-137","b":"康軒","s":"第三、四課","t":"文法選擇","q":"The dog is ＿＿ the tree.","o":["on","between","under","in front"],"a":"C","e":"選項(Ａ)狗狗「在」樹「上」，介系詞須用 in；選項(Ｂ)須是 between the trees；選項(Ｄ)「在…前面」，介系詞須用 in front of。"},{"id":"kx-138","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Tiffany: ＿＿ the women from?  Larry: ＿＿ from India.","o":["Where is; She’s","Where is; They’re","Where are; They’re","Where are; She’s"],"a":"C","e":"the women 為複數，應搭配複數 be 動詞，答句的主詞也要用複數代名詞 They’re。"},{"id":"kx-139","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Ann: What ＿＿ a monkey ＿＿?  Ben: It can walk on its legs.","o":["can; doing","is; doing","does; do","can; do"],"a":"D","e":"由答句的 It can... 可知，問句的第一空格為助動詞 can；助動詞後面須接原形動詞，故第二空格為 do。"},{"id":"kx-140","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s not ＿＿ late.","o":["go","look","shout","be"],"a":"D","e":"late 為形容詞，搭配原形動詞 be。"},{"id":"kx-141","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ the spoon.  The soup is so hot.","o":["use","to use","using","uses"],"a":"A","e":"此句為祈使句，Let’s＋原形動詞，故選(Ａ)。"},{"id":"kx-142","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Ms. Wu: ＿＿ the lady.  Students: No problem.","o":["Follow, please","Please follow","Please don’t","Don’t, please"],"a":"B","e":"Ms. Wu：請跟著那位女士。學生：沒問題。"},{"id":"kx-143","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Everyone, ＿＿ a good time at my party.","o":["is having","are playing","have","play"],"a":"C","e":"各位，在我的派對玩得愉快吧。Everyone 之後有逗號，因此其後是祈使句句型，故用原形 V 作答。"},{"id":"kx-144","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: Are you from Taiwan, Paul Lin?  B:","o":["No, I’m not.","Yes, we are.","Yes, I’m.","No, you’re not."],"a":"A","e":"(Ｂ)應為單數 (Ｃ)Yes, I am 不可縮寫 (Ｄ)應回答自己。"},{"id":"kx-145","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Jim, ＿＿ kind to your friends.","o":["is","be","do","to be"],"a":"B","e":"be kind to：對…要友善。"},{"id":"kx-146","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Cindy: Is your classmate, Jenny, from ＿＿ USA?  Amy: No, she’s from ＿＿ India.","o":["the; ×","×; the","the; the","×; ×"],"a":"A","e":"USA 前面需有定冠詞 the，而 India 前面則不需要。"},{"id":"kx-147","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Harry: ＿＿ the place?  Dori: It’s a magic school.","o":["Where’s","What’s","How’s","Who’s"],"a":"B","e":"問是什麼地方，用疑問詞 what。"},{"id":"kx-148","b":"康軒","s":"第三、四課","t":"文法選擇","q":"It’s Christmas!  Let’s ＿＿ fun.","o":["be","to be","have","to have"],"a":"C","e":"人＋have＋fun；事物＋be＋fun。Let’s 後接原形動詞。"},{"id":"kx-149","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Which sentence is NOT correct?","o":["Please don’t go to the forest（森林）, Tracy.","Don’t open it, please, Polly.","Abby, be a good student, please.","Miffy, please come in."],"a":"B","e":"這題考的是祈使句中人名（稱呼語）與 please 的正確語序。在英文中，祈使句 + please + 人名 的組合有一定語序慣例，其中(B)應改成Please don’t open it, Polly.或Polly, don’t open it, please."},{"id":"kx-150","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Frank,","o":["open the door please.","please, don’t close the door.","please good.","be happy, please."],"a":"D","e":"(Ｄ)正確，其他選項應改為(Ａ) open the door, please.(Ｂ)please don’t close the door.(Ｃ) please be good.。"},{"id":"kx-151","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Lancy: Can your dog ＿＿ a ball?  Branda：Yes, he can.","o":["catching","is catch","to catch","catch"],"a":"D","e":"助動詞 can 後面接原形動詞。"},{"id":"kx-152","b":"康軒","s":"第三、四課","t":"文法選擇","q":"This is my brother, Joe.  Let’s ＿＿ games together.","o":["play","to play","be play","plays"],"a":"A","e":"此句為祈使句句型：Let’s＋原形動詞.。"},{"id":"kx-153","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: ＿＿ run ＿＿?  B: No, he","o":["Can Ben; fastly; can only run very slowly.","Cannot Ben; quickly; can’t.","Can’t Ben; fast; can’t. He is a slow runner.","Can Ben not; quick; cannot."],"a":"C"},{"id":"kx-154","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Please ＿＿ the book, boys and girls.","o":["reads","read","to read","not read"],"a":"B","e":"祈使句直接用原形動詞。"},{"id":"kx-155","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Many cute animals ＿＿ in Dr. White’s House.","o":["there are","are","are there","have"],"a":"B","e":"在 Dr. White’s House 裡面有很多可愛的動物。主詞為 Many cute animals 後方直接接複數 be 動詞 are 即可。"},{"id":"kx-156","b":"康軒","s":"第三、四課","t":"文法選擇","q":"You ＿＿ late again.  Don’t ＿＿ late next time（下一次）.","o":["be; are","are; are","be; be","are; be"],"a":"D","e":"前面為一般的直述句，後面為祈使句。"},{"id":"kx-157","b":"康軒","s":"第三、四課","t":"文法選擇","q":"The chair is heavy, and my mother ＿＿ move it.","o":["be","is","can’t","aren’t"],"a":"C","e":"椅子很重，「沒有辦法」移動，表示能力，用助動詞 can’t。"},{"id":"kx-158","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿, come in, ＿＿.","o":["Please; don’t","William; please","Please; William","Don’t; William"],"a":"B","e":"(Ａ) Please 置句首，後不加逗點，須改成 Please don’t come in.。(Ｃ) Please 在動作前面，其後不打逗號，須改成 Please come in, William.。(Ｄ)須改成 Don’t come in, William.。"},{"id":"kx-159","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ nice to your new classmate, ＿＿.","o":["Please; Mike","Please be; Mike","Mike; please","Please; Mike is"],"a":"B","e":"“be nice to＋人” 意謂「對某人好」。Please be nice to your new classmate, Mike.＝Mike, please be nice to your new classmate.＝Mike, be nice to your new classmate, please."},{"id":"kx-160","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ me, and I can（可以）take you home.","o":["Follow","Don’t follow","To follow","Let’s follow"],"a":"A","e":"「跟著」我，我可以帶你回家。用肯定的方式呈現。"},{"id":"kx-161","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Duke ＿＿ good at home and ＿＿ nice to Kelly today.","o":["are; are","be; be","×; are you","is; is"],"a":"D","e":"主詞之後沒有逗號為直述句，Duke 為第三人稱單數，故用 be 動詞 is。"},{"id":"kx-162","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: Is the picture ＿＿ room?  B: That’s right.","o":["in the front of the","in front of","in the front of","in front of the"],"a":"A","e":"在建築物裡的前面要使用 “in the front of the＋地點”，故選(Ａ)。"},{"id":"kx-163","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Nicole: ＿＿ the place?  Daniel: Isn’t it the bathroom?","o":["Who’s","Where’s","What’s","How’s"],"a":"C","e":"詢問這是「什麼」地方用疑問詞 what。"},{"id":"kx-164","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ inviting Eric, please.  He’s not my friend now!","o":["No","Don’t","Not","Let’s"],"a":"A","e":"祈使句：No＋V-ing，表示「禁止…」；亦可寫成“Don’t＋原形動詞”。"},{"id":"kx-165","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ late for school.","o":["don’t be","not","don’t","not be"],"a":"D","e":"Let’s 之後可接（not）＋原形動詞，late 是「形容詞」，其前要加進 be 動詞。"},{"id":"kx-166","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Teachers usually（通常）stand（站）＿＿ the classroom and write on the blackboard（黑板）.","o":["in front of","in the front of","in back of","in the back of"],"a":"B","e":"在「一個空間裡面的前面」，應選(B)。"},{"id":"kx-167","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: Let’s ＿＿ the car in front of us too close.  Keep（保持）a safe distance（距離）when we drive.","o":["follow","don’t follow","not follow"],"a":"C","e":"Let’s not表「讓我們不要...」，故選C。"},{"id":"kx-168","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Which is WRONG?","o":["It’s my pet cat, and its name is Kitten.","My best friend, Lisa, is beautiful but short.","The men from the USA is my English teacher.","They’re big red apples, not small green guavas."],"a":"C","e":"(Ｃ)用 is，主詞應改為單數 The man。"},{"id":"kx-169","b":"康軒","s":"第三、四課","t":"文法選擇","q":"A: What ＿＿ the kids make?  B: Some cookies.","o":["are","can","is","does"],"a":"B","e":"本題的主要動詞為原形動詞（make），故前面需搭配助動詞（如 can、do/does）。又因主詞 the kids 為複數，不可用 does，故選 (B) can。"},{"id":"kx-170","b":"康軒","s":"第三、四課","t":"文法選擇","q":"The businessmen ＿＿ in the living room.","o":["can’t be","is sitting","can","sitting"],"a":"A","e":"主詞 businessmen 為複數，表推測時用助動詞 can，後面的 be 動詞 are 需改為原形動詞 be，表示「在」的意思。"},{"id":"kx-171","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Where are ＿＿?","o":["Mr. and Mrs. Wang’s daughter, Sandy","dog and cat","the fish","workbooks and notebooks"],"a":"C","e":"動詞是複數動詞，選項(Ａ)是單數主詞；選項(Ｂ)須改成 the dog and the cat；選項(Ｃ)\"fish\" 是單複數同型。 當它指「一群魚」時，複數依然是 fish。選項(Ｄ)須改成 the workbooks and the notebooks.。"},{"id":"kx-172","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Our English teacher is ＿＿ front of the classroom, and she is teaching an English song.","o":["in","in the","on","on the"],"a":"B","e":"英文老師正在教室的「前面部分」，有所限定，須用 the front，其前介系詞用 in。"},{"id":"kx-173","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Which sentence is right?","o":["Don’t close to the water. It’s dangerous（危險的）.","Please wake up her. It is time to go home.","Turn off the TV now and go to bed.","Look! The girl dancing over there."],"a":"C"},{"id":"kx-174","b":"康軒","s":"第三、四課","t":"文法選擇","q":"The teacher is ＿＿ the classroom.  He’s teaching.","o":["in front of","between","in the front of","next"],"a":"C","e":"in the front of 表示「在…的前面」，指的是「在教室內的前方」，這是老師授課時常站的位置。整句意思為：「老師在教室的前面，他正在教書。」符合情境、文法正確。(Ａ)在…(外部)前方，若使用此選項，表示老師站在教室外面，不符合「正在教書」的場景。"},{"id":"kx-175","b":"康軒","s":"第三、四課","t":"文法選擇","q":"＿＿ a good student at school.","o":["Do","Please do","Do be","Don’t"],"a":"C","e":"do 在此為加強語氣。句意：「務必」在校當個好學生。"},{"id":"kx-176","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Duke, ＿＿ good at home and ＿＿ nice to your sister.","o":["are; are","be; be","×; are you","is; is"],"a":"B","e":"Duke 之後有逗號，其後接 and 連接的兩個祈使句動作，故選原形動詞作答。"},{"id":"kx-177","b":"康軒","s":"第三、四課","t":"文法選擇","q":"Hey, ＿＿.  We are in class.","o":["don’t talk","please don’t talking","don’t talking, please","not talk"],"a":"A","e":"正確寫法：Hey, don’t talk. 亦可寫成 “Hey, please don’t talk.＝Hey, don’t talk, please.”。"},{"id":"hl-001","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Leo: ＿＿ is it today?  Jane: It’s Monday.","o":["What day","What time","When","Who"],"a":"A","e":"由回答 Monday 可知，是在詢問「星期」。"},{"id":"hl-002","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Rita: ＿＿ you doing?  Lisa: I’m eating an apple.","o":["What is","Is","What are","Are"],"a":"C","e":"Rita 問：「妳正在做什麼？」，Lisa 才會以「我正在吃蘋果。」回應。"},{"id":"hl-003","b":"翰林","s":"第三、四課","t":"文法選擇","q":"＿＿ talk in the room.  The baby is sleeping now.","o":["Don’t","Not","Doesn’t","You are not"],"a":"A","e":"Don’t＋原形動詞。"},{"id":"hl-004","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Howard can play baseball, but his sister ＿＿.","o":["can’t","can","is","isn’t"],"a":"A","e":"用連接詞 but 連接，前後句語意應為相反，故選(Ａ)。"},{"id":"hl-005","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Sandy: Can you swim?  Lucy: ＿＿  But I can play basketball.","o":["Yes, I can.","No, I can’t.","Can you?","Can’t you?"],"a":"B","e":"but 表語氣轉折，此答句中，but 後接肯定句，前句應為否定，故選(Ｂ)。"},{"id":"hl-006","b":"翰林","s":"第三、四課","t":"文法選擇","q":"My baby brother ＿＿ in the bedroom now.  Let’s be quiet.","o":["sleeps","am sleep","sleep","is sleeping"],"a":"D","e":"正在發生的事情，要用「現在進行式（be V＋V-ing）」。主詞 My baby brother 為第三人稱單數，be V 用 is。"},{"id":"hl-007","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Ken: ＿＿ is the movie?  Jay: It’s at four o’clock.","o":["What","What day","How old","What time"],"a":"D","e":"回答是「是在四點鐘。」，故選 What time 作答。"},{"id":"hl-008","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Cathy: ＿＿ is the movie?  Lion: It’s at 6 o’clock.","o":["What","Who","What time","What day"],"a":"C","e":"根據回答是在 6 點鐘，所以問句應該用「What time」。"},{"id":"hl-009","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Jolin is a nice girl.  Don’t you like（喜歡）＿＿?","o":["her","him","me","it"],"a":"A","e":"代名詞 her 代替其前的女孩。"},{"id":"hl-010","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Bob: Who ＿＿ cook in your family?  Emi: My dad ＿＿.  He is a handsome good cook.","o":["can; can","can’t; can’t","can; can’t","can’t; can"],"a":"A","e":"Bob 詢問 Emi「妳家中誰會煮飯？」Emi 以「我爸爸會。」回應，Emi 並稱讚她爸爸是個帥氣的好廚師呢。兩空格皆用肯定助動詞作答。"},{"id":"hl-011","b":"翰林","s":"第三、四課","t":"文法選擇","q":"（David is talking to his friend on the phone.）  David: Hi, Emma.  ＿＿ you doing now?  Emma: I am studying English.","o":["What day are","What time is","What are","Where is"],"a":"C","e":"由 Emma 回應正在唸英文，可知 David 在電話中詢問 Emma 現在正在做「什麼」，故選(Ｃ)。"},{"id":"hl-012","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Andy: ＿＿ are you playing baseball?  Zac: At school.","o":["What","Who","Where","What time"],"a":"C","e":"根據回答是在學校，所以疑問句應該用「Where」。"},{"id":"hl-013","b":"翰林","s":"第三、四課","t":"文法選擇","q":"David and Cindy ＿＿ water（水）now.","o":["is drinking","are drinking","drink","drinks"],"a":"B","e":"David 和 Cindy 現在「正在喝」水。"},{"id":"hl-014","b":"翰林","s":"第三、四課","t":"文法選擇","q":"John and Susan gave（給）＿＿ a nice jacket（夾克）as（當作）a Christmas present（聖誕禮物）.〔91.基測Ⅱ〕","o":["I","me","mine","myself"],"a":"B","e":"為授與動詞的用法：「主詞＋授與動詞＋受詞＋物」，故用「受格」作答。(Ｃ)我的（所有格代名詞）(Ｄ)我自己。"},{"id":"hl-015","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Dan: Where（在哪裡）is John?  Jill: In the kitchen.  He ＿＿ dinner.  We’re going to（即將）have noodles（麵）tonight（今晚）.〔111.會考補考〕","o":["cooks","is cooking","was cooking","would cook"],"a":"B","e":"由「今晚即將吃麵」，推知 John 煮飯的動作還在進行中，故用(Ｂ)現在進行式表示。"},{"id":"hl-016","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Please ＿＿ run in the classroom.","o":["not","don’t","not to","doesn’t"],"a":"B","e":"「不要」在教室奔跑。否定的祈使句句型用 don’t＋原形 V。"},{"id":"hl-017","b":"翰林","s":"第三、四課","t":"文法選擇","q":"My favorite writer’s meet-and-greet is ＿＿ Friday this week.","o":["in","on","at","with"],"a":"B","e":"「在」星期五，介系詞用 on 作答。"},{"id":"hl-018","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ eat or ＿＿ in the lab.  It is dangerous（危險）.","o":["be; don’t drink","not; drink","×; drink","×; drinking"],"a":"B","e":"Let’s not＋原形動詞。"},{"id":"hl-019","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Jane: Who can go with me?  Ben: I sure ＿＿.  I’m your good husband.","o":["can","can’t","am","am not"],"a":"A","e":"問句中有助動詞 can，簡答句中仍用 can 作答。"},{"id":"hl-020","b":"翰林","s":"第三、四課","t":"文法選擇","q":"＿＿ a bad student.  ＿＿ a good boy at home.","o":["Be; Don’t be","Be; Be","Don’t be; Be","Don’t be; Don’t be"],"a":"C","e":"第一句是「否定」祈使句，第二句則是「肯定」祈使句。"},{"id":"hl-021","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Joe: What day is the concert?  Alice: It’s ＿＿ Saturday.","o":["on","in","at","×"],"a":"A","e":"詢問演唱會在哪一天，故用「在星期六」回答，要用介系詞 on 作答。"},{"id":"hl-022","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ to the 7-ELEVE and ＿＿ hot dogs.","o":["go; eat","to go; to eat","to go; eat","go; to eat"],"a":"A","e":"Let’s 原形 V1... and 原形 V2...。"},{"id":"hl-023","b":"翰林","s":"第三、四課","t":"文法選擇","q":"The magic show（表演）is ＿＿ 8:00 p.m. ＿＿ Sunday.","o":["at; on","in; on","at; in","×; on"],"a":"A","e":"時間的介系詞用「at」，星期日的介系詞用「on」。"},{"id":"hl-024","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Sara: Can’t your sister play basketball?  Beth: No, she ＿＿, but my brother ＿＿.","o":["isn’t; is","can; can’t","is; isn’t","can’t; can"],"a":"D","e":"否定簡答 Can’t 開頭的問句，須用 can’t，而連接詞 but 則連接語氣相反的簡述句，仍須用 can。"},{"id":"hl-025","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Rick: I can’t swim（游泳）.  ＿＿ you?  Dave: Sure.  It’s a piece of cake（非常簡單的事）for me.","o":["Can","Can’t","Are","Aren’t"],"a":"A","e":"Rick 表示不會游泳。接著問 Dave「你會嗎？」Dave 表明「當然會。對我而言是非常簡單的事。」。"},{"id":"hl-026","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Shh...  The baby ＿＿ now.","o":["sleeping","is sleeping","sleep","sleeps"],"a":"B","e":"噓…寶寶現在「正在睡覺」。"},{"id":"hl-027","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Look!  Ed ＿＿ over there（在那裡）.  Let’s say hi to him.","o":["is running","runs","to run","run"],"a":"A","e":"由 Look! 可知，要用「現在進行式（be V＋V-ing）」。"},{"id":"hl-028","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Harry: Can you fly a kite（放風箏）?  Rick: No, ＿＿.","o":["but I can’t play basketball","I can’t jump rope","but my brother can","and I can draw a picture, too"],"a":"C","e":"答句中含 No，故知答案為否定，若用連接詞 but，須連接語意肯定的句子；選項(Ｄ)連接詞 and 須連接否定的附和句，即 “and I can’t draw a picture, either”（我也不會畫圖），故選(Ｃ)。"},{"id":"hl-029","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Nancy: ＿＿ sleep in the classroom?  Mark: No, you can’t.","o":["Can you","Can I","Can he","Can they"],"a":"B","e":"Nancy 問「我可以」在教室睡覺嗎？ Mark 回答不行。"},{"id":"hl-030","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Can you go to the concert ＿＿ me on Friday evening?  It’s ＿＿.","o":["and; great","for; cute","with; free","at; popular"],"a":"C","e":"「和…」做某動作，介系詞用 with；free 除了當「空閒的」外，還可作「免費的」。"},{"id":"hl-031","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Nina ＿＿, not ＿＿ now.","o":["is singing; dancing","singing; dancing","sings; dances","is singing; dance"],"a":"A","e":"Nina 現在「正在唱歌」，而不是「跳舞」。現在進行式強調動作進行中，所以動詞要加上-ing 形式。"},{"id":"hl-032","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Jack’s sister is nice to her friends.  Everyone（大家）loves（喜愛）＿＿.","o":["him","her","them","you"],"a":"B","e":"動詞後面用受格，且 Jack 的姐姐是女生，she 的受格用 her。"},{"id":"hl-033","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Who ＿＿ and ＿＿ on TV?","o":["singing; dancing","singing; is dancing","is singing; dancing","is singing; is dancing"],"a":"C","e":"Who（誰）當主詞，視為單數，須接單數 be 動詞，即「Who is V1-ing and V2-ing...?」。"},{"id":"hl-034","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Is the party ＿＿ seven thirty ＿＿ the evening?","o":["×; in","at; ×","×; ×","at; in"],"a":"D","e":"「在」7:30，介系詞用 at；「在」晚上，介系詞用 in。"},{"id":"hl-035","b":"翰林","s":"第三、四課","t":"文法選擇","q":"In the classroom, please ＿＿ and ＿＿.  Students are sleeping now.","o":["don’t run; be quiet","not run; be quiet","don’t run; quiet","not run; quiet"],"a":"A","e":"don’t＋原形動詞，be＋形容詞 quiet。"},{"id":"hl-036","b":"翰林","s":"第三、四課","t":"文法選擇","q":"The Jackson family ＿＿ a picture now.","o":["is taking","took","take","takes"],"a":"A","e":"主詞 The Jackson family 視為單數，動詞用「is taking」。"},{"id":"hl-037","b":"翰林","s":"第三、四課","t":"文法選擇","q":"The movie is ＿＿ 7 p.m. ＿＿ Friday.","o":["in; on","at; at","from; to","at; on"],"a":"D"},{"id":"hl-038","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Students, please be quiet.  It’s time ＿＿ class.","o":["on","in","for","with"],"a":"C"},{"id":"hl-039","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Martin’s son can play baseball, but his daughter ＿＿.","o":["can","can’t","is","isn’t"],"a":"B"},{"id":"hl-040","b":"翰林","s":"第三、四課","t":"文法選擇","q":"A: What time is the baseball game?  B: It’s ＿＿ 6 p.m.","o":["at","on","in","to"],"a":"A"},{"id":"hl-041","b":"翰林","s":"第三、四課","t":"文法選擇","q":"A: Are you ＿＿ to music now?  B: Yes, ＿＿.","o":["listen; I am","listen; I’m not","listening; I am","listening; I can"],"a":"C"},{"id":"hl-042","b":"翰林","s":"第三、四課","t":"文法選擇","q":"＿＿ run in the classroom, guys.","o":["Not","Can’t","Don’t","Don’t be"],"a":"C"},{"id":"hl-043","b":"翰林","s":"第三、四課","t":"文法選擇","q":"A: Where are they going?  B: They ＿＿ to the museum.","o":["go","are going","can go","aren’t going"],"a":"B"},{"id":"hl-044","b":"翰林","s":"第三、四課","t":"文法選擇","q":"A: What is Betty ＿＿?  B: She’s taking a walk at the park.","o":["do","can do","doing","don’t do"],"a":"C"},{"id":"hl-045","b":"翰林","s":"第三、四課","t":"文法選擇","q":"These erasers are for ＿＿, not for ＿＿.","o":["they; we","them; us","they’re; we’re","their; our"],"a":"B"},{"id":"hl-046","b":"翰林","s":"第三、四課","t":"文法選擇","q":"A: ＿＿ your baby brother do?  B: He can draw with a marker.","o":["Is","Can","What is","What can"],"a":"D"},{"id":"hl-047","b":"翰林","s":"第三、四課","t":"文法選擇","q":"A: What day is today?  B: It’s ＿＿ Tuesday.","o":["×","on","at","in"],"a":"A"},{"id":"hl-048","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Laura ＿＿ dinner in the living room with her family now.","o":["eat","eating","is eating","are eating"],"a":"C"},{"id":"hl-049","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Please ＿＿ run on the bus.  It’s not safe.","o":["no","not","don’t","can’t"],"a":"C"},{"id":"hl-050","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Rita is ＿＿ and ＿＿ with her sister in the park.","o":["sing; dance","singing; dance","sing; dancing","singing; dancing"],"a":"D","e":"Rita 和她的妹妹正在公園裡「唱歌」和「跳舞」。"},{"id":"hl-051","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Tom: What day is the party?  Peter: It’s ＿＿.","o":["Friday","on Friday","7 o’clock","at 7 o’clock"],"a":"B","e":"回答特殊節日或活動在哪一天，要用介系詞（on）＋星期。"},{"id":"hl-052","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Ken: What time is the concert?  Ann: It’s ＿＿ 7:00 p.m.","o":["at","on","in","×"],"a":"A","e":"「在」晚上七點，介系詞用 at 作答。"},{"id":"hl-053","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Gary: Who can open the big box?  Elsa: My uncle ＿＿ it.","o":["can not open","can opens","can open","can’t open"],"a":"C","e":"Gary 問誰能打開這個大箱子？ Elsa 回答她的叔叔「能打開」它。"},{"id":"hl-054","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Look!  Brother John ＿＿ a music video in the living room.","o":["watching","reading","is watching","is reading"],"a":"C","e":"Look!（看啊！）其後句子動詞用「現在進行式」，而「觀看」音樂影片，動詞用 watch，故選(Ｃ)。"},{"id":"hl-055","b":"翰林","s":"第三、四課","t":"文法選擇","q":"＿＿ you or your brother at home now?","o":["Am","Is","Are","Be"],"a":"C","e":"連接詞 or 連接兩個主詞時，動詞要以靠近動詞的主詞為準，故選(Ｃ)。"},{"id":"hl-056","b":"翰林","s":"第三、四課","t":"文法選擇","q":"I have an English class ＿＿ Tuesday evening.","o":["on","in","at","×"],"a":"A","e":"「在」特定日子的晚上，介系詞用 on。"},{"id":"hl-057","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Look!  The dog ＿＿ in the park.","o":["run","runs","running","is running"],"a":"D","e":"看！這隻狗「正在」公園裡「奔跑」。Look! 表示正在發生的事件，所以動詞要加上-ing 形式。"},{"id":"hl-058","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Girls, don’t eat ＿＿ drink here.","o":["or","and","for","with"],"a":"A","e":"女孩們，不要在這裡吃東西「或是」喝飲料。"},{"id":"hl-059","b":"翰林","s":"第三、四課","t":"文法選擇","q":"I have two cats.  I love（喜愛）＿＿.","o":["they","them","it","us"],"a":"B","e":"我有兩隻貓。我喜愛「牠們」，受格用 them。"},{"id":"hl-060","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Grandma’s party is at ＿＿, right（對的）?","o":["this week","Friday evening","7:30 p.m.","the weekend"],"a":"C","e":"選項(Ａ)之前不須加進介系詞；選項(Ｂ)其前的介系詞須是 on；選項(Ｄ)其前的介系詞是 on；故選(Ｃ) at＋時刻。"},{"id":"hl-061","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Ms. Lee is our teacher.  She is very nice to ＿＿.","o":["we","us","I","our"],"a":"B","e":"介系詞後面用受格，故選(Ｂ)。"},{"id":"hl-062","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Our cousin is coming to our house ＿＿ Monday morning.","o":["on","in","at","×"],"a":"A","e":"「在」特定日子的早上，時間介系詞用 on 作答。"},{"id":"hl-063","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ a song for our teacher.","o":["singing","sang","sing","sings"],"a":"C","e":"Let’s 後面接原形動詞。"},{"id":"hl-064","b":"翰林","s":"第三、四課","t":"文法選擇","q":"This is Judy, and I am ＿＿ cousin.","o":["she","her","his","my"],"a":"B","e":"這位是 Judy，我是「她的」表妹。Judy 的代名詞所有格用 her。"},{"id":"hl-065","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Kiki: Can your cousins play with your doll?  Mary: No, ＿＿.","o":["you can’t","they can’t","we can’t","she can’t"],"a":"B","e":"Kiki 問妳的表姐妹們可以玩妳的娃娃嗎？ Mary 回答不，「她們不可以」。"},{"id":"hl-066","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Let’s ＿＿ to that new classmate.","o":["be nice","don’t fight","not wait","do not look"],"a":"A","e":"我們「善待」那位新同學吧。句子是「Let's ______ to that new classmate.」，屬於祈使句用法，Let's 後面要接原形動詞。選項(Ｂ)須改成 Let’s not fight with that...；選項(Ｃ) wait 之後的介系詞為 for；選項(Ｄ) do 須去掉，而且 look 之後的介系詞為 at。"},{"id":"hl-067","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Jill ＿＿ on the sofa and ＿＿ a comic book.","o":["sitting; reading","is sitting; is reading","sitting; is reading","is sitting; reading"],"a":"D","e":"主詞＋be 動詞＋V1-ing...＋and＋V2-ing...。"},{"id":"hl-068","b":"翰林","s":"第三、四課","t":"文法選擇","q":"You are too（太）quiet.  You can talk to ＿＿.","o":["he","they","she","us"],"a":"D","e":"你太安靜了。你可以跟「我們」說話。我們的受格是 us。"},{"id":"hl-069","b":"翰林","s":"第三、四課","t":"文法選擇","q":"J.K. Rowling is Ray’s favorite writer.  Let’s give（給）one of her book to ＿＿.","o":["him","them","she","he"],"a":"A","e":"介系詞後面用受格，且 Ray 是男生，he 的受格是 him。"},{"id":"hl-070","b":"翰林","s":"第三、四課","t":"文法選擇","q":"You are in the library（圖書館）now.  ＿＿ talk to your friends.  This is a quiet place.","o":["Let’s","Please not","Please don’t","I can"],"a":"C","e":"祈使句要表達否定語氣時，用法是 Please don’t＋原形動詞。"},{"id":"hl-071","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Father is busy（忙碌的）.  Don’t talk to ＿＿ now.","o":["he","him","his","you"],"a":"B","e":"爸爸很忙。現在不要和「他」說話。"},{"id":"hl-072","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Be quiet.  The students ＿＿ tests now.  Please don’t disturb（打擾） them.","o":["can have","are having","have","has"],"a":"B","e":"從文意中，推測得知學生們正在進行測驗，所以不要打擾他們。現在進行式用 be＋V-ing。"},{"id":"hl-073","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Our son, Joe, ＿＿ an English comic book.","o":["is reading","is studying","are reading","are studying"],"a":"A","e":"主詞只有一人，須接單數 be 動詞，而「看」（英語）漫畫書，用 read（閱讀），不可用 study（研讀）。"},{"id":"hl-074","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Max: ＿＿ our son doing?  Eva: Isn’t he ＿＿ a comic book in his room?","o":["What are; studying","Are; reading","What is; reading","Is; studying"],"a":"C","e":"第一空格須填進「疑問詞 What＋單數 be 動詞」，因為問句主詞 our son 是「第三人稱單數」；第二空格「看」漫畫書，動詞須用 read 作答。"},{"id":"hl-075","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Vicky’s birthday（生日）party is ＿＿ 7:30 ＿＿ Saturday evening.","o":["at; in","×; on","at; ×","at; on"],"a":"D","e":"「在」7:30，介系詞用 at；「在」星期六晚上，介系詞用 on。"},{"id":"hl-076","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Students: Can we play cards in the classroom?  Teacher: No, ＿＿.","o":["we can","I can","you can’t","they can’t"],"a":"C","e":"學生們問「我們可以在教室玩牌嗎？」老師對學生的回答「你們不可以」。"},{"id":"hl-077","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Robert and Larry are my cousins.  I play with ＿＿.","o":["we","us","they","them"],"a":"D","e":"Robert 和 Larry 是我的表兄弟。我和「他們」一起玩。"},{"id":"hl-078","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Ian: What day is today?  Alex: It’s ＿＿ Thursday.","o":["on","in","at","×"],"a":"D","e":"問今天星期幾，不需用介系詞。"},{"id":"hl-079","b":"翰林","s":"第三、四課","t":"文法選擇","q":"＿＿ English（英語）teacher, Lisa, is from America（美國）.  ＿＿ is tall and beautiful.","o":["Her; Her","My; Her","Our; She","We; She"],"a":"C","e":"「我們的」英文老師 Lisa 從美國來。「她」又高又美麗。"},{"id":"hl-080","b":"翰林","s":"第三、四課","t":"文法選擇","q":"＿＿, sit down, ＿＿.","o":["Please; Mike","Mike; please","Please; don’t","Don’t; Mike"],"a":"B","e":"選項(Ａ) Please 在動作前面，其後不打逗號；(Ｃ)須改成 Please don’t sit down；(Ｄ)須改成 Don’t sit down, Mike.。"},{"id":"hl-081","b":"翰林","s":"第三、四課","t":"文法選擇","q":"The English class is ＿＿.","o":["at nine thirty","ten o’clock","Monday","in Wednesday"],"a":"A","e":"特殊節日或活動在哪一天，要用介系詞（on）＋星期或介系詞（at）＋時間。"},{"id":"hl-082","b":"翰林","s":"第三、四課","t":"文法選擇","q":"A: Miss Lin, can I have a talk with you?  B: Sure, ＿＿ sit down.","o":["be","let","have","please"],"a":"D","e":"please sit down：請坐下。"},{"id":"hl-083","b":"翰林","s":"第三、四課","t":"文法選擇","q":"＿＿ my cat.  ＿＿ name is Mimi.","o":["Its; it’s","It is; It’s","It’s; Its","Its; Its"],"a":"C","e":"「牠是」我的貓。「牠的」名字叫 Mimi。"},{"id":"hl-084","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Roy and I love（愛）our dad very much（非常）.  He is as busy as a bee（很忙）, but he plays basketball with ＿＿ after dinner（晚餐）.","o":["us","them","me","him"],"a":"A","e":"Roy 和我很喜歡我們的爸爸。即使很忙，晚餐後他和「我們」打籃球。用「我們」代替「Roy 和我」。"},{"id":"hl-085","b":"翰林","s":"第三、四課","t":"文法選擇","q":"David: Are these ＿＿ dolls, girls?  Kelly: No, ＿＿ aren’t.","o":["your; they","their; they","his; he","her; she"],"a":"A","e":"David 問女孩們這些是「妳們的」娃娃嗎？ Kelly 回答不，「它們」不是。"},{"id":"hl-086","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Jill: ＿＿ you play basketball?  Lisa: No, but I ＿＿ jump rope.","o":["Can; ×","Can’t; ×","Can; can’t","Can’t; can"],"a":"D","e":"第一空格可用 Can 或 Can’t；第二空格，因已有 No 回答，表示「不會打籃球」，而 but 要連接語意相反，故選「會跳繩」。"},{"id":"hl-087","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Jo won’t（將不）be happy if you’re late（遲到）for his party tonight（今晚）, so ＿＿ sure that you arrive on time.〔114.會考〕","o":["make","makes","to make","is making"],"a":"A","e":"如果你今天晚上在 Jo 的派對遲到，他會不開心，所以要確保你能準時抵達。此句句型是 make sure that...（確保…），為祈使句，當給出指令、建議或提醒時，會省略主詞，使用原形動詞開頭。"},{"id":"hl-088","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Maybe my dad is at home now, but I ＿＿ sure.","o":["am not","can not","am","can be"],"a":"A","e":"可能我爸爸現在在家，但我「不確定」，sure 當「形容詞」，其前要加進 be 動詞。"},{"id":"hl-089","b":"翰林","s":"第三、四課","t":"文法選擇","q":"＿＿ a map（地圖）with（和…一起）you when（當…的時候）you go to a place for the first time（第一次）.〔106.會考〕","o":["Have taken","Take","Taking","To take"],"a":"B","e":"當你第一次去一個地方時，要隨身帶張地圖，是「祈使句」，故用原形動詞開頭。"},{"id":"hl-090","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Mia: Aunt Lisa is coming（將要來了）.  Ted: Great（太棒了）!  We can take ＿＿ to Wu Ma Ma’s Kitchen for a big dinner（晚餐）.","o":["her","them","it","him"],"a":"A","e":"動詞後面用受格，且 Aunt Lisa 是女性，she 的受格用 her。"},{"id":"hl-091","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Amy: What’s the bird ＿＿ in the tree?  Ken: It ＿＿ in the tree.","o":["doing; singing","is doing; is singing","is doing; singing","doing; is singing"],"a":"D","e":"問句詢問「鳥正在樹上做什麼？」答句才以「牠正在樹上唱歌。」回應；問句 be 動詞已移到主詞 the bird 前面，故第一空格只須填上 V-ing，第二空格則須用 be＋V-ing 作答。"},{"id":"hl-092","b":"翰林","s":"第三、四課","t":"文法選擇","q":"＿＿ Friday evening, everyone in the Brown family ＿＿ free.","o":["At; are","For; is","In; are","On; is"],"a":"D","e":"「在」特定日子晚上的介系詞用 On，形容詞 free（有空的），其前 Brown 家裡的「每個人」是單數主詞，故用單數 be 動詞。"},{"id":"hl-093","b":"翰林","s":"第三、四課","t":"文法選擇","q":"＿＿ in the classroom.  Please follow the rules.","o":["Students don’t run, please","Please don’t run, students","Please, students, not run","Students, please don’t run"],"a":"D","e":"正確寫法有以下三種：Please don’t run in the classroom, students.；Students, please don’t run in the classroom.；Students, don’t run in the classroom, please.。"},{"id":"hl-094","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Everyone in my family ＿＿ a big Christmas dinner（聖誕大餐）now.  They ＿＿ a good time.","o":["eating; having","is eating; are having","eat; have","are having; are playing"],"a":"B","e":"第一句句尾有 now，因此用「現在進行式」，而 Everyone（每個人）視為單數主詞，須取單數 be 動詞。第二句「正玩得愉快」，須用 have 的現在分詞形式作答。"},{"id":"hl-095","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Ben often（通常）reads comic books in bed late（很晚地）at night.  His mom walks in and says, “It’s too late.  Please close ＿＿ and go to sleep now.”","o":["them","their","they","it"],"a":"A","e":"句中的動詞是 close，後面要接「關起來的東西」，所以要用「them」（受格），意思是把漫畫書收起來。"},{"id":"hl-096","b":"翰林","s":"第三、四課","t":"文法選擇","q":"The ball game is ＿＿ 2:00 p.m. ＿＿ 5:00 p.m.","o":["from; to","at; at","on; to","for; at"],"a":"A","e":"球賽是「從」下午 2:00「到」下午 5:00。"},{"id":"hl-097","b":"翰林","s":"第三、四課","t":"文法選擇","q":"＿＿ do it for me, ＿＿.","o":["Greg; please","Not; Greg","Greg; don’t","Please; Greg"],"a":"D","e":"第一空格只能填 Please，其後不須打上逗號，就可直接接動作；第二空格只能填人名，其前須打上逗號。"},{"id":"hl-098","b":"翰林","s":"第三、四課","t":"文法選擇","q":"These markers are from my classmate, Lily.  I like（喜歡）＿＿.","o":["it","they","them","their"],"a":"C","e":"這些彩色筆是複數，且放在動詞後面，所以用受格 them當受詞。"},{"id":"hl-099","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Are you ready ＿＿ the party tonight（今晚）?","o":["to","for","at","in"],"a":"B","e":"你今晚準備好參加（be ready for＋N）派對了嗎？"},{"id":"hl-100","b":"翰林","s":"第三、四課","t":"文法選擇","q":"The dolls are very beautiful.  Don’t you like（喜歡）＿＿?","o":["it","they","them","me"],"a":"C","e":"動詞後面用受格，用 them 代替複數名詞 the dolls。"},{"id":"hl-101","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Elsa: Do you know（知道）anyone（任何人）from Class A?  Jeff: No, I don’t know any（任何一個）of ＿＿.〔96.基測Ⅰ〕","o":["they","their","theirs","them"],"a":"D","e":"介系詞 of 之後的代名詞要用「受格」，用 them 代替 Class A 的學生。(Ｃ)他們的（所有格代名詞）。"},{"id":"hl-102","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Our father ＿＿ free this Saturday.  He can’t be with us at home.","o":["is","isn’t","are","aren’t"],"a":"B","e":"這個星期六我們的爸爸「沒空」。他不能和我們一起在家裡。主詞是第三人稱單數，須用否定 be 動詞 isn’t 作答。"},{"id":"hl-103","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Please ＿＿.","o":["standing here, boys","not to stand here, boys","stand here, boys","be stand here, boys"],"a":"C","e":"Please (don’t)＋原形動詞＋主詞。"},{"id":"hl-104","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Don’t read comic books ＿＿ talk on the phone in class.","o":["and","but","or","×"],"a":"C","e":"Don’t V1... or V2...：不要做 V1... 和 V2... 兩個動作。"},{"id":"hl-105","b":"翰林","s":"第三、四課","t":"文法選擇","q":"John ＿＿ the rule.  Please wait here for lunch（午餐）.","o":["let’s follow","follow please",", please follow","follow"],"a":"C","e":"正確寫法有以下三種：John, please follow the rule.；John, follow the rule, please.；Please follow the rule, John.。"},{"id":"hl-106","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Elise: I need（需要）a dress（洋裝）for tomorrow’s（明天）party（派對）, but I don’t have one.  Fiona: Why don’t（為什麼不）you try on（試穿）my red one?  I bought（買）＿＿ last week（週）.〔100.基測Ⅰ〕","o":["it","one","ones","them"],"a":"A","e":"上星期購買的一件紅洋裝，已有所指定，用單數代名詞 it 代替之。"},{"id":"hl-107","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Everyone ＿＿ a good time at my party now.","o":["play","is playing","have","is having"],"a":"D","e":"Everyone（每個人）是單數主詞，句尾時間 now（現在），其前用「現在進行式」，而「玩得愉快」的動詞片語是 have a good time。"},{"id":"hl-108","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Everyone in my family ＿＿ very happy ＿＿ weekends.","o":["are; at","is; on","are; in","is; for"],"a":"B","e":"Everyone 是單數主詞，接單數 be 動詞，而在特定日子的介系詞用 on，on weekends 即「每逢週末」。"},{"id":"hl-109","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Isn’t it twelve ＿＿?  Time for lunch（午餐）.","o":["a.m.","p.m.","in the morning","in the evening"],"a":"B","e":"不是「中午」十二點嗎？該吃午餐了。"},{"id":"hl-110","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Jacky’s ＿＿ a walk and ＿＿ on the phone.","o":["taking; talking","take; talk","taking; talk","take; talking"],"a":"A","e":"Jacky’s 即 Jacky is 的縮寫式，其後接由 and 連接的兩個現在分詞。"},{"id":"hl-111","b":"翰林","s":"第三、四課","t":"文法選擇","q":"My mom is free ＿＿ weekends, but she is not ＿＿ this weekend.","o":["on; on","on; ×","×; on","×; ×"],"a":"B","e":"on weekends＝every weekend：每逢週末；this weekend（這個週末），其前不須用介系詞。"},{"id":"hl-112","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Please ＿＿ there.  Wait here.","o":["not come","not go","don’t come","don’t go"],"a":"D","e":"Please 之後可接（don’t）＋原形 V...，而只能用 come here（來這裡），go there（去那裡）。"},{"id":"hl-113","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Mary got（得到）two dolls from her grandfather on her birthday（生日）, and she liked（喜歡）＿＿ very much（非常）.〔93.基測Ⅱ〕","o":["her","it","ones","them"],"a":"D","e":"Mary 生日那天得到爺爺送的「兩個洋娃娃」，而她非常喜歡「它們」，用「受格」作答。"},{"id":"hl-114","b":"翰林","s":"第三、四課","t":"文法選擇","q":"A: Let’s ＿＿ to the museum now.  B: Sorry.  I can’t go with you.  I’m ＿＿ my favorite basketball game.","o":["go; watch","going; watch","go; watching","going; watching"],"a":"C"},{"id":"hl-115","b":"翰林","s":"第三、四課","t":"文法選擇","q":"It is not safe there.  Let’s ＿＿ inside.","o":["not go","don’t go","goes","can’t go"],"a":"A","e":"Let’s 的否定型為 Let’s not＋原形動詞；文意為「那裡不安全。我們別進去裡面。」，選(Ａ)。"},{"id":"hl-116","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Everyone in my family ＿＿ a good time at the party this evening.","o":["are having","are playing","is having","is playing"],"a":"C","e":"主詞 Everyone（每個人）是單數代名詞，故接單數 be 動詞，而動詞片語「玩得愉快」則是 have a good time。"},{"id":"hl-117","b":"翰林","s":"第三、四課","t":"文法選擇","q":"A: Abby, ＿＿ nice to your brothers.  Don’t fight with ＿＿.  B: OK, Dad.","o":["be; them","don’t be; him","be; him","don’t be; them"],"a":"A"},{"id":"hl-118","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Is Amanda’s party on ＿＿?","o":["7:30 p.m.","this weekend","Saturday evening","this Saturday"],"a":"C","e":"選項(Ａ)介系詞為 at；選項(Ｂ)、(Ｄ)其前不須介系詞。「在」特定日子的晚上，介系詞用 on。"},{"id":"hl-119","b":"翰林","s":"第三、四課","t":"文法選擇","q":"＿＿ Saturday evening, everyone in the Wang family ＿＿ happy.","o":["In; is","On; is","In; are","On; are"],"a":"B","e":"「在」特定日子的晚上，介系詞用 On，而 everyone（每個人）當主詞時，須取單數動詞。"},{"id":"hl-120","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Our family dog, Lucky, is really cute（可愛的）and smart（聰明的）.  I like（喜歡）＿＿ very much（非常）.","o":["him","them","its","his"],"a":"A","e":"我們家的狗，Lucky，真的很可愛又聰明。我非常喜歡他。此處應用受格人稱代名詞 him / her / it，故(Ａ)正確。(Ｂ)錯誤，應改為單數人稱代名詞；(Ｃ)、(Ｄ)錯誤，所有格後方須接名詞，且此處應填受格。"},{"id":"hl-121","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Our favorite singer, Billy Fujiki, ＿＿.","o":["are shaking hands with fans","are from Japan（日本）","singing and dancing on the stage","is not free this weekend"],"a":"D","e":"主詞只有一人，故接單數 be 動詞，選項(Ｃ)句首須加進 is。"},{"id":"hl-122","b":"翰林","s":"第三、四課","t":"文法選擇","q":"It’s ＿＿ eight p.m. ＿＿ Saturday.  They are at the concert.","o":["at; on","×; on","at; ×","×; ×"],"a":"B","e":"現在是星期六晚上 8：00，8：00 之前不用介系詞，「在」星期六，介系詞用 on 作答。"},{"id":"hl-123","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Today is ＿＿ Tuesday.  Is Grandma’s birthday（生日）＿＿ this Friday?","o":["on; ×","×; on","on; on","×; ×"],"a":"D","e":"今天是「星期二」，日子之前不用加介系詞；而奶奶的生日是「這個星期五」，日子之前也不用加介系詞。"},{"id":"hl-124","b":"翰林","s":"第三、四課","t":"文法選擇","q":"You or I ＿＿ careful enough.","o":["am","is","are","be"],"a":"A","e":"or 連接兩個主詞時，動詞以靠近的主詞為準。中譯成「不是你就是我夠小心翼翼的。」。"},{"id":"hl-125","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Today is ＿＿ Wednesday, and Grandma’s birthday（生日）is ＿＿ this Saturday.","o":["on; ×","×; on","on; on","×; ×"],"a":"D","e":"今天是「星期三」，日子之前不須加介系詞，而「這個星期六」，其前也不須加介系詞。"},{"id":"hl-126","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Liz: My dog, Rocky, ＿＿ jump rope.  ＿＿ your dog, Money?  Sue: He can, too.  Let（讓）Rocky and Money jump rope at the park.","o":["can; Can","can’t; Can’t","can; Can’t","can’t; Can"],"a":"A","e":"由 Sue 所說 He can, too. 可推知 Liz 的狗 Rocky「會」跳繩，而 Liz 用「妳的狗 Money 會嗎？」也用肯定助動詞詢問。"},{"id":"hl-127","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Rita: What are you doing?  Sarah:","o":["I’m drawing a picture.","I’m a teacher.","I am at the park.","I’m doing it."],"a":"A","e":"詢問「妳正在做什麼？」，用「現在進行式」的動作回答，選項(Ｄ)語意不清。"},{"id":"hl-128","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Andy: ＿＿  Jerry: Yes, she is.","o":["What are your parents doing?","What is she doing?","Who are you talking with?","Is Miss Lin singing a song?"],"a":"D","e":"回答為 Yes / No，故為 Yes / No 問句；選項(Ａ)(Ｂ)(Ｃ)不宜作答。"},{"id":"hl-129","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Sarah: ＿＿ does your little（小的）sister get up（起床）?  Willy: About（大約）six.〔94.基測Ⅱ〕","o":["How often","How old","What day","What time"],"a":"D","e":"由 Willy 的回答可知問的是「時間」，故用 What time 詢問幾點。"},{"id":"hl-130","b":"翰林","s":"第三、四課","t":"文法選擇","q":"There’s（有）a big test（考試）today.  Everyone in my class ＿＿.","o":["are running there","are jumping up and down","is studying for it","is small and thin"],"a":"C","e":"今天有個大考。我班上每個人「正在為它研讀」。"},{"id":"hl-131","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Linda: Who’s watching a movie on TV?  Dad:","o":["Mom is in the kitchen.","Grandpa and Grandma are.","No, I’m not watching TV.","Aren’t you in the living room?"],"a":"B","e":"問「誰正在觀看電視上一部電影呢？」，故用「人」開頭回答即可，選(Ｂ)；選項(Ａ)地點較不適合作答。"},{"id":"hl-132","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Neil: Where’s Cindy?  Andy:","o":["She is singing.","She is not home.","She is reading in her room.","No, she isn’t."],"a":"C","e":"用 Where 問，至少須回答出地點，故選(Ｃ)。"},{"id":"hl-133","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Cindy: Is the girl drawing a picture?  Michel:","o":["Yes, she is taking a picture.","No, she’s not taking a picture.","Yes, she is.","No, she’s drawing a picture with me."],"a":"C","e":"是 Yes / No 問句，要用 Yes / No 回答，若答 Yes，即「女孩正在畫圖」，若答 No，表示「女孩不是正在畫圖」，而是「女孩正在做其他動作」。"},{"id":"hl-134","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Amy: Are you studying?  Gina: No, ＿＿.","o":["I am, but you are not","I am studying English","I’m reading an English comic book","you are not, but I am"],"a":"C","e":"Yes / No 問句，要用 Yes / No 回答，而 No 後面要接 not 或直接接正在做的事，選項(Ａ)、(Ｄ)至少須改成 I am not, but you are 方為正解。"},{"id":"hl-135","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Kevin: ＿＿  Silvia: Running at the park.","o":["How is Bob doing?","Where’s Bob from?","What is Bob doing?","Who is Bob running with?"],"a":"C","e":"由答句可知是問「Bob 正在做什麼？」，故選(Ｃ)。"},{"id":"hl-136","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Rita: What’s Rose doing at the park?  Ben:","o":["She’s doing it with a handsome guy.","She’s not singing at the park.","She’s not doing it.","She’s dancing."],"a":"D","e":"問正在做的事，故選語意明確的肯定直述句(Ｄ)作答。"},{"id":"hl-137","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Bob: ＿＿  Meg: No, I’m studying English.","o":["Are you reading an English book?","What are you doing?","Are you studying English？","What are you reading?"],"a":"A","e":"回答為 No，故為 Yes / No 問句，而且答句中沒有 not，故問句要選新的或相對的動作。"},{"id":"hl-138","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Alex: Is Mark playing baseball?  Ben:","o":["He is playing basketball.","Yes, he is playing basketball.","Yes, he is.","No, he is not dancing with Mary."],"a":"C","e":"是 Yes / No 問句，要用 Yes / No 回答，不能選(Ｄ)，換新動作時，須把 not 去掉。"},{"id":"hl-139","b":"翰林","s":"第三、四課","t":"文法選擇","q":"Sam: You are not studying.  Are you doing a report?  Leo:","o":["No, I’m talking to Aunt Vicky on the phone.","Yes, it’s for my dog.","I’m not free. Let’s not talk with each other.","No, I’m doing an English report."],"a":"A","e":"Leo 不是在讀書，Sam 又問 Leo「是在寫報告嗎？」，Leo 以「不是，我正在和 Vicky 姑媽講電話。」回應。"},{"id":"hl-140","b":"翰林","s":"第三、四課","t":"文法選擇","q":"John: Who are you looking at?  Cindy:","o":["My favorite dog.","The tall boy under the tree.","No, I am not looking at him.","Am I not looking at you and me?"],"a":"B","e":"原問句 Who 是詢問「人」，故選(Ｂ)。"},{"id":"hl3v-001","b":"翰林","s":"第三課","t":"字彙選擇","q":"That ＿＿ is my uncle.  He is a very tall man.","o":["sign","guy","rule","hand"],"a":"B"},{"id":"hl3v-002","b":"翰林","s":"第三課","t":"字彙選擇","q":"Look at the ＿＿.  “No Food（食物）.”","o":["time","place","sign","hand"],"a":"C"},{"id":"hl3v-003","b":"翰林","s":"第三課","t":"字彙選擇","q":"The bus is here.  ＿＿!","o":["Hurry","Wait","Wash","Talk"],"a":"A"},{"id":"hl3v-004","b":"翰林","s":"第三課","t":"字彙選擇","q":"Be ＿＿.  Don’t run in the kitchen.","o":["sure","young","beautiful","careful"],"a":"D"},{"id":"hl3v-005","b":"翰林","s":"第三課","t":"字彙選擇","q":"Read the pictures.  What words（字詞）may（可能）Hank type（輸入）on the computer（電腦）?","o":["Baseball books.","Art museum.","Jump rope.","Star signs."],"a":"A","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAz4AAAGXCAAAAABXLNoLAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAAmJLR0QAAKqNIzIAAAAMY21QUEpDbXAwNzEyAPgBA+rMYJUAAIqSSURBVHhe7b0NYBPXlS9+TcKnGWOHBMLEbgz5GGIKMaC2hkJggPKy2qxKGlKz1W4DRCXqdt+L1aD/7uu2guh189oVXbm7b3fVVCW0u9rilE2ImmpTSiJSKDjpJHFIMIgmwamdSSABGw0GbD78P/fOh2akkTWyJUvCc3cbLOnOnXvP3N+cc89n2eUTvchsJgVMCmRPgfKZZcdN9GRPN/MKkwKYAjeXvW4SwqSASYGhUeDmMm5oF5pXmRQwKTCj7FWTCCYFRjUFzvZolj9hOkLGvkKILntlVJPOXPyop8D7H9ygoUHPjFtTvpo264P3k3pNmwVX3VLWmkq/y/2XrxYVVa+7ftx1RTUhczLXDgXeqqQ0i+k9Mxe+ui2BlmPCxY4GsReFBDS26hT8BV8R+BxKJsTl3rHTp0wsKvLE450TysuKakrmZK4VCrx942TNUs598mn4amGV8uVr3ejNz5Ne1EL02oWF1JEP4bc3Pw//qS47mESGvnN33ll8lLn05ifUmOKbljmj0qfA29O13Ec4+Wn4an6lsrI3etDri0mvm+9Cly9ORl1/gN9eX4zhc91GLQEun6ufWYQkuY7u/WR8Ec7LnFLJU+Djiolj1K3/3E3w1fTY8ffFNiXeP4avJr3OX7xxzDh08h3cna+GlU8p269d/7lZRch7yBR/2z+h5B+VuYDio8DRWyo0k4p/cBd8NfePZ6Vv8V+vfE7sdX097ME3iKPBK5+D/3zqug2aa69eWVCsh/TxXeOKj/bmjEqeAp9UabnPpbM3wlfThEsSS8J/dd5Ceo379CRY7k3xy/BT5y2Y+1y3XrP+SzfUFCs9Jr83pgxdEfqSW//lAfNUVKwPrQTm9ckNE2umJFr/he4b4asbz8nwwX/9kYavxoy5ZSr65KOqMeO6AT5/pGFtlWX7NCu88Gks0h function addWrong(kind,id){const k=kind==="mc"?"mc":"word";let w=S.wrong.find(x=>x.id===id);if(w){w.ok=0;w.n=(w.n||1)+1;w.t=Date.now()}else S.wrong.push({kind:k,id,ok:0,n:1,t:Date.now()});save()}
const inScope=it=>{const d=it.kind==="mc"?qById(it.id):wordById(it.id);return d&&d.b===S.book&&related(d.s,S.lesson)};
const wrongs=kind=>S.wrong.filter(it=>(it.kind==="mc")===(kind==="mc")&&inScope(it));

/* ---------- data helpers ---------- */
const words=()=>DATA.V.filter(v=>v.b===S.book&&related(v.s,S.lesson));
const qs=()=>DATA.M.filter(m=>m.b===S.book&&related(m.s,S.lesson));
const wordById=id=>DATA.V.find(v=>v.id===id), qById=id=>DATA.M.find(m=>m.id===id);

/* ---------- speech ---------- */
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/samantha|google|aria|jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
const SAY={"p.m.":"P M","a.m.":"A M","the USA":"the U S A","let's...":"let's","K-pop":"K pop","meet-and-greet":"meet and greet","Guess what?":"Guess what"};
function speak(w,slow){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SAY[w]||w);u.lang="en-US";if(voice)u.voice=voice;u.rate=slow?.55:.85;speechSynthesis.speak(u)}
const speaker=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;

  S.wrong.forEach(x=>{if(x.kind==="spell")x.kind="word"});const r=rankOf(S.xp), W=words(), Qs=qs(), ww=wrongs("word").length, wm=wrongs("mc").length, allW=ww+wm, blocked=allW>=WRONG_MAX;

function topBar(label,i,n,extra=""){return `<div class="top"><span>${label}　${i+1} / ${n}</span>${extra}<button class="btn ghost sm" id="quit">離開</button></div><div class="prog"><i style="width:${i/n*100}%"></i></div>`}
function bindQuit(){$("#quit").onclick=home}

/* ---------- 背單字 ---------- */
function learn(){
  const W=words(); const weak=shuffle(wrongs("word").map(it=>wordById(it.id))).slice(0,2); let set=weak.concat(W.filter(w=>!S.learned[w.id]&&!weak.includes(w)&&!wrongs("word").some(x=>x.id===w.id)).slice(0,5-weak.length));
  if(set.length<5)set=set.concat(shuffle(W.filter(w=>!set.includes(w))).slice(0,5-set.length));
  let i=0;
  const card=()=>{const w=set[i];
    $("#app").innerHTML=`<div class="card">${topBar("背單字",i,set.length)}
      <div class="flash"><div class="dots">${set.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>
      <button class="say" id="say" aria-label="播放發音">${speaker}</button>
      <div class="word">${esc(w.w)}</div>${w.k?`<div class="kk">[${esc(w.k)}]</div>`:""}
      <div class="zh">${posTags(w.p)}${esc(w.z)}</div>
      <button class="btn ghost sm" id="slow">慢慢唸</button></div>
      <div class="row"><button class="btn ghost" id="prev" ${i?"":"disabled"}>上一個</button><button class="btn" id="next">${i<set.length-1?"下一個":"開始小考"}</button></div></div>`;
    bindQuit(); speak(w.w);
    $("#say").onclick=()=>speak(w.w); $("#slow").onclick=()=>speak(w.w,true);
    $("#prev").onclick=()=>{i--;card()}; $("#next").onclick=()=>{if(i<set.length-1){i++;card()}else quiz()};
  };
  const quiz=()=>{
    const pool=words(); let k=0, right=0; const miss=[];
    const items=shuffle(set).map((w,j)=>({w,mode:j%2?"listen":"zh"}));
    const ask=()=>{const {w,mode}=items[k];
      const opts=shuffle([w,...shuffle(pool.filter(x=>x.id!==w.id&&x.w!==w.w)).slice(0,3)]);
      $("#app").innerHTML=`<div class="card">${topBar("單字小考",k,items.length)}
        <div class="flash">${mode==="zh"?`<p class="note">選出正確的英文</p><div class="zh">${posTags(w.p)}${esc(w.z)}</div>`:`<p class="note">聽發音，選出中文意思</p><button class="say" id="say">${speaker}</button>`}</div>
        <div class="opts">${opts.map((o,j)=>`<button class="opt" data-id="${o.id}"><b>${L[j]}</b><span>${mode==="zh"?esc(o.w):posTags(o.p)+esc(o.z)}</span></button>`).join("")}</div><div id="fb"></div></div>`;
      bindQuit(); if(mode==="listen"){speak(w.w);$("#say").onclick=()=>speak(w.w)}
      $$(".opt").forEach(b=>b.onclick=()=>{const ok=b.dataset.id===w.id;$$(".opt").forEach(x=>{x.disabled=true;if(x.dataset.id===w.id)x.classList.add("ok")});
        if(!ok){b.classList.add("no");miss.push(w);addWrong("word",w.id)}else{right++;sparkle(b)}
        $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"答對了！":"答錯了，"}<b>${esc(w.w)}</b> ${posTags(w.p)}${esc(w.z)}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">${k<items.length-1?"下一題":"看結果"}</button></div>`;
        speak(w.w); $("#nx").onclick=()=>{k++;k<items.length?ask():done()}});
    };
    const done=()=>{const all=right===items.length;
      set.forEach(w=>{if(!miss.includes(w))S.learned[w.id]=true}); addXP(right*2+(all?5:0)); if(all)S.stars++; save();
      result(all?"全對！拿到 1 顆星":"再加油！全對才拿得到星星",`${right} / ${items.length}`,miss.map(w=>[w.w,w.z]),learn,"再背 5 個");};
    ask();
  };
  card();
}

/* ---------- 拼字挑戰 ---------- */
function spell(){
  const weakS=shuffle(wrongs("word").map(it=>wordById(it.id))).slice(0,4); const set=shuffle(weakS.concat(shuffle(words().filter(w=>!weakS.includes(w))).slice(0,10-weakS.length))); let i=0,pts=0,tries=0,hints=0,wait=false; const miss=[];
  const letters=s=>s.replace(/[^a-zA-Z]/g,"");
  const ask=()=>{const w=set[i];tries=0;hints=0;wait=false;
    $("#app").innerHTML=`<div class="card spell">${topBar("拼字挑戰",i,set.length,`<span class="stars" style="font-size:17px">${pts} 分</span>`)}
      <div class="flash"><button class="say" id="say">${speaker}</button><div class="zh">${posTags(w.p)}${esc(w.z)}</div><div class="slots" id="slots"></div></div>
      <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="拼出英文">
      <div id="fb"></div>
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="hint">提示（−1 分）</button><button class="btn" id="ok">送出</button></div></div>`;
    bindQuit(); speak(w.w); $("#say").onclick=()=>speak(w.w);
    const inp=$("#ans"); const draw=()=>{const t=letters(inp.value);let k=0;$("#slots").innerHTML=[...w.w].map(ch=>/[a-zA-Z]/.test(ch)?`<span>${esc(t[k++]||"")}</span>`:`<span class="f">${ch===" "?"":esc(ch)}</span>`).join("")};
    draw(); inp.focus(); inp.oninput=draw; inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();submit()}};
    $("#hint").onclick=()=>{if(wait)return;const L2=letters(w.w);if(hints>=L2.length-1)return;hints++;let k=0,o="";for(const ch of w.w){if(k>=hints)break;o+=ch;if(/[a-zA-Z]/.test(ch))k++}inp.value=o;draw();inp.focus()};
    $("#ok").onclick=submit;
    function submit(){
      if(wait){i++;return i<set.length?ask():done()}
      if(!inp.value.trim())return;
      if(norm(inp.value)===norm(w.w)){const g=Math.max(0,(tries?1:2)-(hints?1:0));pts+=g;wait=true;sparkle($("#ans"));
        $("#fb").innerHTML=`<div class="fb ok">答對了！+${g} 分　<b>${esc(w.w)}</b>${w.k?` [${esc(w.k)}]`:""}</div>`;$("#ok").textContent=i<set.length-1?"下一題":"看結果";speak(w.w)}
      else{tries++;
        if(tries<2){$("#fb").innerHTML=`<div class="fb no">差一點，再試一次！</div>`;const c=$(".card");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");inp.select()}
        else{wait=true;miss.push(w);addWrong("spell",w.id);$("#fb").innerHTML=`<div class="fb no">正確答案是 <b>${esc(w.w)}</b>${w.k?` [${esc(w.k)}]`:""}</div>`;$("#ok").textContent=i<set.length-1?"下一題":"看結果";speak(w.w)}}
    }
  };
  const done=()=>{const star=pts>=16;addXP(pts+(star?5:0));if(star)S.stars++;save();
    result(star?"拼字高手！拿到 1 顆星":"16 分以上就有星星，再挑戰一次！",`${pts} / 20 分`,miss.map(w=>[w.w,w.z]),spell,"再挑戰一次")};
  ask();
}

/* ---------- 文法闖關 ---------- */

    <div class="qtext" style="margin-top:12px">${blank(q.q)}${q.img?`<img src="${q.img}" alt="題目圖片">`:""}</div>
    <div class="opts">${opts.map(({o,j})=>`<button class="opt" data-j="${j}"><b>${L[j]}</b><span>${esc(o)}</span></button>`).join("")}</div><div id="fb"></div></div>`;
  bindQuit();
  $$(".opt").forEach(b=>b.onclick=()=>{const ok=L[+b.dataset.j]===q.a;$$(".opt").forEach(x=>{x.disabled=true;if(L[+x.dataset.j]===q.a)x.classList.add("ok")});if(!ok)b.classList.add("no");else sparkle(b);
    $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"答對了！":`答錯了，正確答案是 (${q.a})`}${q.e?`<div class="ex">${esc(q.e)}</div>`:""}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">${i<n-1?"下一題":"看結果"}</button></div>`;

function grammar(){
  const weakQ=shuffle(wrongs("mc").map(it=>qById(it.id))).slice(0,3); const set=shuffle(weakQ.concat(shuffle(qs().filter(q=>!weakQ.includes(q))).slice(0,10-weakQ.length))); let i=0,right=0,starGot=0; const miss=[];
  const cellsHTML=()=>`<span class="cells" aria-label="充電格">${[0,1,2,3,4].map(k=>`<i class="${k<S.cells?"on":""}"></i>`).join("")}</span>`;
  const ask=()=>mcView(set[i],"文法闖關",i,set.length,cellsHTML(),(ok,nx)=>{
    if(ok){right++;S.cells++;if(S.cells>=5){S.cells=0;S.stars++;starGot++}}else{miss.push(set[i]);addWrong("mc",set[i].id)} save();
    $(".cells").outerHTML=cellsHTML();
    nx().onclick=()=>{i++;i<set.length?ask():done()}});
  const done=()=>{addXP(right*3);result(starGot?`充飽電了！拿到 ${starGot} 顆星`:`答對 5 題就能充滿 1 顆星`,`${right} / ${set.length}`,miss.map(q=>[q.o[L.indexOf(q.a)],q.q.replace(/＿＿/g,"___")]),grammar,"再闖一關")};
  ask();
}

/* ---------- 錯題本 ---------- */
function review(kind="word"){
  const list=shuffle(wrongs(kind)).slice(0,10); let i=0,cleared=0; if(!list.length)return wrongBook(kind);
  const next=()=>{i++; if(i<list.length)ask(); else done()};
  const ask=()=>{const it=list[i];
    if(it.kind==="mc"){const q=qById(it.id);if(!q){S.wrong=S.wrong.filter(x=>x!==it);return next()}
      mcView(q,"錯題複習",i,list.length,"",(ok,nx)=>{mark(it,ok);nx().onclick=next})}
    else{const w=wordById(it.id);if(!w){S.wrong=S.wrong.filter(x=>x!==it);return next()}
      $("#app").innerHTML=`<div class="card spell">${topBar("錯題複習",i,list.length)}
        <div class="flash"><button class="say" id="say">${speaker}</button><div class="zh">${posTags(w.p)}${esc(w.z)}</div><p class="note">連續答對 ${it.ok} / 2 次</p></div>
        <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="拼出英文"><div id="fb"></div>
        <div class="row" style="margin-top:10px"><button class="btn" id="ok">送出</button></div></div>`;
      bindQuit();speak(w.w);$("#say").onclick=()=>speak(w.w);const inp=$("#ans");inp.focus();let doneQ=false;
      const sub=()=>{if(doneQ)return next();if(!inp.value.trim())return;doneQ=true;const ok=norm(inp.value)===norm(w.w);mark(it,ok);
        $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"答對了！":"正確答案是"} <b>${esc(w.w)}</b></div>`;$("#ok").textContent=i<list.length-1?"下一題":"看結果";speak(w.w)};
      $("#ok").onclick=sub;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();sub()}}}
  };
  const mark=(it,ok)=>{const w=S.wrong.find(x=>x.id===it.id);if(!w)return;if(ok){w.ok++;if(w.ok>=2){S.wrong=S.wrong.filter(x=>x.id!==it.id);cleared++;addXP(3)}}else w.ok=0;save()};
  const left=wrongs(kind).length; const done=()=>result(cleared?`有 ${cleared} 題練熟、畢業了！`:"再練一次，連續答對 2 次就會畢業",`還剩 ${wrongs(kind).length} 題`,[],()=>wrongBook(kind),"回錯題本");
  ask();
}

/* ---------- 首頁下方：最近錯的、還沒背的 ---------- */

/* ---------- 錯題本 ---------- */
function wrongBook(tab="word"){
  speechSynthesis?.cancel();
  const W=wrongs("word").map(it=>({it,w:wordById(it.id)})).sort((a,b)=>(b.it.n||1)-(a.it.n||1));
  const M=wrongs("mc").map(it=>({it,q:qById(it.id)})).sort((a,b)=>(b.it.n||1)-(a.it.n||1));

  $("#app").innerHTML=`<div class="card"><div class="top"><span>錯題本　${esc(S.book)}・${esc(S.lesson)}</span><button class="btn ghost sm" id="quit">回首頁</button></div>
    <p class="note" style="text-align:left;margin-top:6px">寫錯的題目都會留在這裡。連續答對 2 次才會畢業，錯越多次的排越前面。</p>
    <div class="tabs" style="margin-top:12px"><button class="chip" data-t="word" aria-pressed="${tab==="word"}">還不會的單字（${W.length}）</button><button class="chip" data-t="mc" aria-pressed="${tab==="mc"}">文法錯題（${M.length}）</button></div></div>
    <div class="card">${tab==="word"?(W.length?`<div class="row" style="margin-bottom:14px"><button class="btn" id="prac">練習這些單字</button></div><div class="wb">${W.map(({it,w})=>`<div class="wi"><div class="h"><span class="en">${esc(w.w)}</span><span class="cnt">錯 ${it.n||1} 次</span></div><div class="cz">${posTags(w.p)}${esc(w.z)}${w.k?` <span class="note" style="display:inline">[${esc(w.k)}]</span>`:""}</div><div><span class="cnt ok">連續答對 ${it.ok}/2</span></div></div>`).join("")}</div>`:`<div class="empty">目前沒有不會的單字，太棒了！</div>`)
    :(M.length?`<div class="row" style="margin-bottom:14px"><button class="btn" id="prac">練習這些文法題</button></div><div class="wb">${M.map(({it,q})=>`<div class="wi"><div class="h"><span class="cnt">錯 ${it.n||1} 次</span><span class="cnt ok">連續答對 ${it.ok}/2</span></div><div class="q">${fill(q)}</div>${q.e?`<div class="ex">${esc(q.e)}</div>`:""}</div>`).join("")}</div>`:`<div class="empty">目前沒有文法錯題，太棒了！</div>`)}</div>`;
  $("#quit").onclick=home; $$(".tabs .chip").forEach(c=>c.onclick=()=>wrongBook(c.dataset.t));
  if($("#prac"))$("#prac").onclick=()=>review(tab);
}

/* ---------- result ---------- */
function result(msg,score,miss,again,againLabel){
  speechSynthesis?.cancel();
  $("#app").innerHTML=`<div class="card result">${WHALE.replace("<svg ","<svg class=\"whale\" ")}<div class="big">${esc(score)}</div><h2 style="margin:0;font-size:20px">${esc(msg)}</h2>
    <div class="stars">★ 目前 ${S.stars} 顆星</div>
    ${miss.length?`<div class="list"><p class="note">這些要再多看幾次（已放進錯題本）：</p>${miss.map(([a,b])=>`<div><b>${esc(a)}</b><span>${blank(b)}</span></div>`).join("")}</div>`:""}
    <div class="row" style="width:100%"><button class="btn ghost" id="h">回首頁</button><button class="btn" id="a">${esc(againLabel)}</button></div></div>`;
  $("#h").onclick=home; $("#a").onclick=()=>{if(wrongs("word").length+wrongs("mc").length>=WRONG_MAX&&!/wrongBook|review/.test(String(again)))home();else again()};
}
home();
</script>
</body>
</html>
