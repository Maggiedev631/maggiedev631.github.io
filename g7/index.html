<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>國一英文練功房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Quicksand:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one bright phone-width column on a pink-to-lilac sky. Whale + title, a gem-badge status card with the rank ladder, then lesson pickers and four pastel mission cards. Light theme only, by choice. */
:root{
  --sky1:#FFF3F7; --sky2:#F1EEFF; --card:#FFFFFF; --ink:#4A3A5C; --muted:#9A8BAA; --line:#F6DCE7;
  --pink:#EE6F9C; --pink-dk:#D9527F; --pink-soft:#FFE6EF; --lilac:#A68BF0; --lilac-soft:#EEE8FF;
  --peach:#FF9F7A; --peach-soft:#FFEDE4; --mint:#3FBF98; --mint-soft:#DFF7EE; --gold:#F2AE1C; --gold-soft:#FFF4D6; --bad:#F06A6A; --bad-soft:#FFE7E7;
  --hand:"LXGW WenKai TC","Noto Sans TC",sans-serif; --round:"Quicksand","Noto Sans TC",system-ui,sans-serif; --body:"Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100%;background:radial-gradient(#FBD3E2 1.2px,transparent 1.6px) 0 0/22px 22px,linear-gradient(170deg,var(--sky1),var(--sky2) 70%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 8px 24px rgba(214,120,170,.12)}
/* header */
.title{display:flex;align-items:center;gap:12px}
.title svg{width:78px;height:50px;flex:none;animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px) rotate(-2deg)}}
.title h1{font-family:var(--hand);font-weight:700;font-size:29px;line-height:1.15;margin:0;letter-spacing:.04em;background:linear-gradient(90deg,var(--pink),var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent}
.title small{display:block;font-family:var(--round);font-weight:600;font-size:13px;color:var(--muted)}
/* status */
.status{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center}
.gem{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:26px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 6px 14px rgba(166,139,240,.25);transform:rotate(-6deg)}
.gem svg{width:30px;height:30px}
.g0{background:linear-gradient(135deg,#F3B391,#D98763)}.g1{background:linear-gradient(135deg,#D9DDEA,#A6ADC6)}.g2{background:linear-gradient(135deg,#FFE08A,#F2AE1C)}
.g3{background:linear-gradient(135deg,#A8EEDD,#4FC6B4)}.g4{background:linear-gradient(135deg,#FFB6D3,#A68BF0)}.g5{background:linear-gradient(135deg,#FF9BC2,#FFD36E,#8FE3C8,#A68BF0)}
.rank{font-size:12px;color:var(--muted);font-weight:700}
.rank b{display:block;font-family:var(--hand);font-size:26px;color:var(--ink);line-height:1.15}
.num{text-align:center;font-size:12px;color:var(--muted);font-weight:700;min-width:54px}
.num b{display:block;font-family:var(--round);font-weight:700;font-size:30px;line-height:1.1;color:var(--pink)}
.num.star b{color:var(--gold)}
.xp{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.xpbar{height:10px;border-radius:99px;background:var(--pink-soft);overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lilac));border-radius:99px;transition:width .6s}
.ladder{grid-column:1/-1;display:flex;justify-content:space-between;gap:4px}
.ladder span{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:3px 0;border-radius:99px;background:#FAF6FC}
.ladder span.on{color:#fff;background:linear-gradient(90deg,var(--pink),var(--lilac))}
.ladder span.done{color:var(--pink);background:var(--pink-soft)}
.stars{font-family:var(--round);font-weight:700;font-size:22px;color:var(--gold);white-space:nowrap}
.step{font-family:var(--hand);font-size:17px;font-weight:700;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:6px}
.step::before{content:"♡";color:var(--pink);font-family:var(--body)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-weight:700;font-size:15px;cursor:pointer;text-align:center;color:var(--muted);transition:all .2s}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 4px 10px rgba(238,111,156,.3)}
.missions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mission{border:none;border-radius:22px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:150px;position:relative;transition:transform .18s,box-shadow .18s}
.mission:hover:not(:disabled){transform:translateY(-3px)}
.mission .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#fff;margin-bottom:4px}
.mission .ic svg{width:26px;height:26px}
.mission b{font-family:var(--hand);font-size:25px}
.mission p{margin:0;font-size:14.5px;color:var(--ink);opacity:.7;line-height:1.45}
.mission .go{position:absolute;top:14px;right:14px;font-family:var(--round);font-weight:700;font-size:13px;background:#fff;border-radius:99px;padding:2px 10px}
.m1{background:var(--pink-soft);color:var(--pink-dk)}.m2{background:var(--gold-soft);color:#C98A00}.m3{background:var(--mint-soft);color:#1E9A76}.m4{background:var(--lilac-soft);color:#7B5BD6}
.mission:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:var(--muted);margin:0;text-align:center}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;margin:0 0 10px}
.btn{border:none;background:linear-gradient(90deg,var(--pink),#F08FB6);color:#fff;border-radius:999px;padding:15px 22px;font-weight:700;font-size:19px;cursor:pointer;letter-spacing:.04em;box-shadow:0 5px 0 var(--pink-dk);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-dk)}
.btn.ghost{background:#fff;color:var(--pink-dk);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 14px;font-size:13px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>.btn{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--hand);font-weight:700;font-size:22px}
.prog{height:10px;border-radius:99px;background:var(--pink-soft);overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lilac));transition:width .3s}
.cells{display:flex;gap:4px}.cells i{width:18px;height:28px;border-radius:5px;border:2px solid var(--mint);background:#fff}.cells i.on{background:var(--mint)}
/* flash card */
.flash{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 4px 10px}
.word{font-family:var(--round);font-size:60px;font-weight:700;line-height:1.1;word-break:break-word;color:var(--ink)}
.kk{color:var(--muted);font-size:21px}
.zh{font-family:var(--hand);font-size:34px;font-weight:700}
.pos{display:inline-block;background:var(--lilac-soft);color:#7B5BD6;border-radius:7px;font-family:var(--body);font-size:12px;padding:1px 7px;margin-right:6px;vertical-align:5px;font-weight:700}
.say{width:80px;height:80px;border-radius:50%;border:none;background:linear-gradient(135deg,#FFD36E,var(--gold));cursor:pointer;display:grid;place-items:center;color:#fff;box-shadow:0 5px 0 #D99600;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.say svg{width:30px;height:30px}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:var(--pink-soft)}.dots i.on{background:var(--pink)}
/* question */
.qtext{font-family:var(--round);font-weight:600;font-size:27px;line-height:1.6;margin-top:18px!important}
.qtext img{display:block;max-width:100%;max-height:170px;margin:10px 0;border-radius:12px;background:#fff}
.bl{display:inline-block;min-width:56px;border-bottom:2.5px solid var(--pink);margin:0 4px;transform:translateY(-5px)}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.opt{border:2px solid var(--line);background:#fff;border-radius:18px;padding:16px 20px;text-align:left;cursor:pointer;font-size:23px;display:flex;gap:12px;align-items:center;font-family:var(--round);font-weight:600;transition:all .15s}
.opt b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--pink-soft);color:var(--pink-dk);font-size:18px;flex:none}
.opt:hover:not(:disabled){border-color:var(--pink);transform:translateX(2px)}
.opt.ok{border-color:var(--mint);background:var(--mint-soft)}.opt.ok b{background:var(--mint);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}.opt.no b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:14px 18px;margin-top:14px;font-size:19px;font-weight:700}
.fb.ok{background:var(--mint-soft);color:#1E9A76}.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ex{color:var(--ink);font-size:17px;margin-top:4px;font-weight:400}
.spell input{width:100%;font-family:var(--round);font-weight:700;font-size:36px;text-align:center;border:2px solid var(--line);border-radius:18px;padding:10px;background:#fff;letter-spacing:1px}
.spell input:focus{border-color:var(--pink);outline:none;box-shadow:0 0 0 4px var(--pink-soft)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:8px 0}
.slots span{width:34px;height:44px;border-radius:10px;background:var(--pink-soft);font-family:var(--round);font-weight:700;font-size:26px;display:grid;place-items:center}
.slots span.f{background:none;width:10px}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result svg.whale{width:120px;height:76px;animation:float 3s ease-in-out infinite}
.big{font-family:var(--round);font-size:56px;font-weight:700;line-height:1;background:linear-gradient(90deg,var(--pink),var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent}
.result h2{font-family:var(--hand)}
.list{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.list div{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;background:var(--pink-soft);font-size:16px}
.list b{font-family:var(--round);font-size:19px}
.shake{animation:sh .35s}@keyframes sh{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.spark{position:fixed;pointer-events:none;z-index:9;font-size:20px;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.4) rotate(180deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.missions{grid-template-columns:1fr}.status{grid-template-columns:auto 1fr}}
.wb{display:flex;flex-direction:column;gap:10px}
.wi{border:2px solid var(--line);border-radius:18px;padding:12px 16px;background:#fff;display:flex;flex-direction:column;gap:4px}
.wi .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wi .en{font-family:var(--round);font-weight:700;font-size:26px}
.wi .cz{font-family:var(--hand);font-size:22px}
.wi .q{font-family:var(--round);font-weight:600;font-size:19px;line-height:1.55}
.wi .ans{color:#1E9A76;font-weight:700;font-family:var(--round);font-size:18px}
.wi .ex{font-size:15px;color:var(--muted)}
.cnt{font-size:13px;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:99px;padding:2px 10px;white-space:nowrap}
.cnt.ok{color:#1E9A76;background:var(--mint-soft)}
.tabs{display:flex;gap:8px}.tabs .chip{flex:1;font-size:17px}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:17px}
.wchips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.3}
.wchip b{font-family:var(--round);font-size:20px}
.wchip span{font-family:var(--hand);font-size:15px;color:var(--muted)}
.wchip:hover{border-color:var(--pink)}
</style>
